# ตรวจทุกครั้งที่ push: ทดสอบฐานข้อมูล (migrations + กฎ RLS) และ build หน้าเว็บ
name: ci
on:
  push:
  pull_request:
jobs:
  db-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: supabase/tests } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
  app-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run build

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ใบยืนยันการผลิต</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2; --card:#fff; --ink:#1d2420; --muted:#5f6a63; --line:#dfe3dd;
  --accent:#0f4a42; --accent-soft:#e3efec; --warn:#b4231b; --warn-soft:#fdecea; --caution:#9a5b00; --caution-soft:#fff4e0; --gold:#c08a3e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}

.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar-logo{height:38px;width:auto;display:block}
.bar h1{font-size:17px;margin:0;flex:1;min-width:180px}
.bar h1 small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.qty-badge{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{border-style:dashed;color:var(--accent)}
.btn.x{border:none;background:none;color:var(--muted);padding:4px 8px}
.btn.x:hover{color:var(--warn)}

main.layout{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
body.preview main.layout{grid-template-columns:minmax(0,1fr)}
#nav{position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;max-height:calc(100vh - 92px);overflow:auto}
#nav .nh{font-weight:700;padding:4px 8px 8px;color:var(--muted);font-size:13px}
#nav a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none}
#nav a:hover{background:var(--accent-soft)}
#nav a .n{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e9ecea;font-size:12px}
#nav a.ok .n{background:var(--accent);color:#fff}
#nav a span.t{flex:1}
#nav a em{font-style:normal;font-size:12px;color:var(--warn);font-weight:600;white-space:nowrap}
#nav a.ok em{color:var(--accent)}
.progress{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.progress.done{background:var(--accent-soft);color:var(--accent)}
.progress.soft{background:var(--caution-soft);color:var(--caution)}
.card{scroll-margin-top:80px}
.field{scroll-margin-top:90px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:10;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.toast.link{pointer-events:auto}.toast a{color:#fff;font-weight:700;text-decoration:underline;margin-left:8px;display:inline-block;padding:6px 0}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 12px;display:flex;gap:8px;align-items:center}
.card h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px}
/* minmax(0,1fr): 1fr ยืดตามตารางกว้างจนหัวข้อล้นจอมือถือ · ตารางเลื่อนใน .tbl-wrap เอง */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.field.wide{grid-column:1/-1}
.lab{font-weight:600;font-size:14px;margin-bottom:4px}
.lab small{font-weight:400;color:var(--muted)}
.req{color:var(--warn);font-style:normal;margin-left:2px}
.hint{color:var(--muted);font-size:13px;margin:-2px 0 6px}
input[type=text],input[type=number],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
input:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input:disabled{background:#f2f3f1;color:#9aa39d}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;background:#fff;user-select:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt input{accent-color:var(--accent);margin:0}
.opt.big{padding:10px 16px;font-size:15px}
.other{margin-top:6px}
.dims{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.dims label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);width:120px}
.dims b{padding-bottom:8px;color:var(--muted)}
.route{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:#faf6ec;border:1px solid #efe2c2;font-size:14px}
.route b{color:var(--gold)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.ft{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
table.ft th,table.ft td{border-bottom:1px solid var(--line);padding:4px;text-align:center}
table.ft th{background:#f7f8f6;font-weight:600;padding:6px 4px;white-space:nowrap}
table.ft td input{padding:5px 6px;text-align:center;min-width:52px}
table.ft td.l input{text-align:left;min-width:150px}
table.ft td .std-cell{display:flex;align-items:center;gap:6px}
table.ft td .std-cell>span{flex:1;text-align:left;padding:5px 6px;min-width:150px}
table.ft td .std{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:6px;font-size:14px;white-space:nowrap;cursor:pointer}
table.ft td .std input{min-width:0;width:20px;height:20px;padding:0}
table.ft select{width:100%;min-width:130px;border:1px solid var(--line);border-radius:6px;padding:5px 4px;background:#fff}
.tlabel{font-weight:700;font-size:11.5px;margin:6px 0 0;color:#333}
table.ft th:first-child,table.ft td.l:first-child,table.ft tfoot td:first-child{position:sticky;left:0;z-index:1;background:#fff;box-shadow:1px 0 0 var(--line)}
table.ft th:first-child,table.ft tfoot td:first-child{background:#f7f8f6}
table.ft tfoot td{font-weight:700;background:#f7f8f6}
.tbl-actions{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pl{display:grid;gap:6px}
.pl-row{display:grid;grid-template-columns:170px 1fr 1fr 1fr;gap:8px;align-items:center}
.pl-head{display:grid;grid-template-columns:170px 1fr 1fr 1fr;gap:8px;font-size:12px;color:var(--muted);padding:0 2px}
#psearch{width:100%;max-width:420px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:2px 0 10px;background:#fff}
.pcat{margin-bottom:10px}
.pcat-t{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.picked{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.picked .sel{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:8px;padding:10px 16px}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.imgs figure{margin:0;width:150px;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;background:#fff}
.imgs img{width:100%;height:120px;object-fit:contain;background:#f7f8f6;display:block}
.imgs figcaption{font-size:12px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imgs .cap{width:100%;border:0;border-top:1px solid var(--line);font:inherit;font-size:12px;padding:4px 6px}
.imgs .btn.x{position:absolute;top:2px;right:2px;background:#fff;border-radius:6px}

.field.missing .lab{color:var(--caution)}
.field.missing input,.field.missing .tbl-wrap,.field.missing .opts .opt{border-color:#e9c27f}
.field.missing.hard .lab{color:var(--warn)}
.field.missing.hard input,.field.missing.hard .tbl-wrap,.field.missing.hard .opts .opt{border-color:#e6a49f}
.alert{background:var(--warn-soft);border:1px solid #f0b9b4;color:var(--warn);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.alert b{display:block;margin-bottom:4px}
.alert ul{margin:0;padding-left:20px}
.alert a{color:var(--warn)}
.alert.soft{background:var(--caution-soft);border-color:#f1d29c;color:var(--caution)}
.alert.soft a{color:var(--caution)}
.alert b+ul{margin-bottom:0}
.alert small{display:block;font-weight:400;margin-top:-2px;margin-bottom:4px}

#doc{display:none}
body.preview #form,body.preview .edit-only{display:none}
body.preview #doc{display:block}
.doc{width:210mm;min-height:297mm;margin:0 auto 24px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:10mm 10mm 14mm;font-size:12px;line-height:1.45;color:#111;font-family:"Noto Sans Thai","Sarabun",sans-serif}
table.pg{width:100%;border-collapse:collapse}
table.pg>thead>tr>td,table.pg>tbody>tr>td{padding:0;vertical-align:top}
table.pg>thead>tr>td{padding-bottom:3mm}
/* หัวกระดาษ: พิมพ์ซ้ำทุกหน้า */
.ph{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;border-bottom:2px solid var(--accent);padding-bottom:5px}
.ph .logo{height:13mm;width:auto;display:block}
.ph .tt{font-size:19px;font-weight:700;line-height:1.2;padding-left:14px;border-left:1px solid #c9cec8}
.ph .tt small{display:block;font-size:12.5px;font-weight:600;color:var(--accent);margin-top:2px}
.ph .no{text-align:right;line-height:1.3;font-size:11.5px;color:#444}
.ph .no .big{display:block;font-size:19px;font-weight:700;color:var(--accent);letter-spacing:.3px}
.ph .no .rev{color:var(--warn);font-weight:700}
.ph .job{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 20px;background:var(--accent-soft);border-radius:5px;padding:4px 10px;font-size:11.5px;margin-top:3px}
.ph .job span{color:#555}
.ph .job b{color:#111}
.d-prod{display:flex;flex-wrap:wrap;gap:3px 18px;background:#faf6ec;border:1px solid #efe2c2;border-radius:5px;padding:5px 10px;margin:6px 0 2px;font-size:12px}
.d-prod b{color:var(--accent)}
.ds{break-inside:avoid;page-break-inside:avoid}
.page-note{display:none;max-width:210mm;margin:0 auto 8px;font-size:13px;color:var(--accent);text-align:right}
body.preview .page-note{display:block}
.page-note.warn{color:var(--warn);font-weight:600}
.doc h3{font-size:13px;margin:10px 0 4px;padding:3px 8px;background:#eef0ec;border-left:4px solid var(--accent);break-after:avoid;page-break-after:avoid}
.kv{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.kv div{display:grid;grid-template-columns:112px 1fr;gap:6px;border-bottom:1px dotted #c9cec8;padding:2.5px 2px;break-inside:avoid}
.kv div.w{grid-column:1/-1}
.kv span{color:#555}
.kv b{font-weight:600;white-space:pre-wrap}
table.dt{border-collapse:collapse;width:100%;font-size:11.5px;margin:5px 0 2px;break-inside:avoid}
table.dt th,table.dt td{border:1px solid #bfc5be;padding:2.5px 5px;text-align:center}
table.dt th{background:#f1f3ef}
table.dt td.l{text-align:left}
table.dt tfoot td{font-weight:700;background:#f7f8f6}
.d-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.d-imgs figure{margin:0;border:1px solid #ccc;border-radius:4px;padding:4px;width:calc(50% - 4px);break-inside:avoid;page-break-inside:avoid}
.d-imgs img{width:100%;height:66mm;object-fit:contain;display:block;background:#fafafa}
.d-imgs figcaption{font-size:10.5px;color:#555;text-align:center;margin-top:2px}
.close{break-inside:avoid;page-break-inside:avoid;margin-top:12px}
.d-note{border:1px solid #e3d3a8;background:#fbf7ec;border-radius:5px;padding:6px 10px;font-size:11.5px}
.d-mock{color:var(--warn);text-align:center;font-weight:600;font-size:12px;margin:6px 0}
.d-accept{background:#fff3a8;border:1px solid #e6cf4f;border-radius:5px;padding:6px 10px;margin:8px 0 6px;text-align:center;color:var(--warn);font-size:11px;font-weight:600}
.d-accept b{display:block;font-size:13px}
.d-terms{margin:0;padding-left:18px;font-size:10.5px;line-height:1.45}
.d-terms+.d-note{margin-top:6px}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.sign>div{border:1px solid #bfc5be;border-radius:5px;padding:7px;text-align:center;font-size:11.5px}
.sign .t{font-weight:700;margin-bottom:24px}
.sign .ln{border-bottom:1px dotted #777;margin:0 6px 4px;height:1px}
@media (max-width:900px){
  main.layout{grid-template-columns:minmax(0,1fr)}
  #nav{display:none}
}
@media (max-width:1100px){
  .bar h1 small{display:none}
}
@media (max-width:700px){
  .bar{position:static}
  .bar .btn{padding:6px 10px;font-size:14px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .pl-row,.pl-head{grid-template-columns:1fr}
  .pl-head{display:none}
  .doc{width:auto;min-height:0;padding:16px;margin:0 0 16px}
  .kv{grid-template-columns:1fr}
  .ph{grid-template-columns:auto 1fr}
  .ph .no{grid-column:1/-1;text-align:left}
}
.co{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}
.co-hint{font-size:13px;color:var(--muted);margin:0 0 6px}
.co-stage{position:relative;width:100%;user-select:none;-webkit-user-select:none;background:#f7f8f6;border-radius:8px;overflow:hidden}
.co-stage img{position:absolute;object-fit:contain}
.co-stage img[data-co-img]{cursor:crosshair}
.co-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.co-dot{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:transparent;border:2px solid var(--gold);padding:0;z-index:2}
button.co-dot{cursor:grab;touch-action:none}
.co-box{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:24%;background:#fff;border:1px solid var(--gold);border-radius:6px;padding:2px 6px;font-size:12px;line-height:1.35;z-index:1;box-shadow:0 1px 3px rgba(0,0,0,.15);overflow-wrap:anywhere}
div[data-co-part].co-box{cursor:move;touch-action:none}
.co-box b{color:var(--accent)}
.co-box small{display:block;color:var(--muted);font-size:11px}
.co-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.co-list li{display:grid;grid-template-columns:26px minmax(0,1.1fr) minmax(0,1.5fr) minmax(0,1.5fr) auto;gap:6px;align-items:center}
.co-n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
@media (max-width:640px){.co-list li{grid-template-columns:26px minmax(0,1fr) auto}.co-list li select,.co-list li input[data-cf="body"]{grid-column:2/3}}
.d-co{margin:6px 0 0;border:1px solid #ccc;border-radius:4px;padding:4px;break-inside:avoid;page-break-inside:avoid}
.d-co .co-box{font-size:7.5pt;max-width:23%}
.d-co .co-box small{font-size:7pt}
.d-co figcaption{font-size:10.5px;color:#555;text-align:center;margin-top:2px}
/* กระดาษ A4 กว้าง ~794px · จอแท็บเล็ตแคบกว่านั้นให้ตัวอย่างพอดีจอ (ตอนพิมพ์ยังเป็น A4) */
@media screen and (max-width:860px){
  .doc{width:auto;min-height:0;padding:16px;margin:0 0 16px}
}
@media print{
  body{background:#fff}
  .bar,#form,#nav,.alert,.toast,.page-note{display:none!important}
  main.layout{display:block;padding:0}
  #doc{display:block!important}
  .doc{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
  <img class="bar-logo" id="barLogo" alt="ภาพพิมพ์ 142">
  <h1 id="barTitle">ใบยืนยันการผลิต<small>แอดมินกรอก → บันทึกเข้าระบบ → ส่งออก PDF ให้ลูกค้าเซ็น</small></h1>
  <span class="qty-badge" id="qtyBadge">0</span>
  <span class="progress edit-only" id="progress"></span>
  <div class="btn-group edit-only">
    <button class="btn" data-act="new" title="ล้างฟอร์มเพื่อเริ่มใบใหม่">ใบใหม่</button>
    <button class="btn" data-act="open" title="เปิดไฟล์ใบงานที่บันทึกไว้ (.json)">เปิดไฟล์</button>
    <button class="btn" data-act="savefile" title="บันทึกเป็นไฟล์ไว้เปิดแก้ไขหรือออกฉบับใหม่ภายหลัง">บันทึกไฟล์</button>
  </div>
  <button class="btn primary edit-only" data-act="savedb" title="เก็บใบนี้ในระบบติดตามการผลิต · ตอนส่งงานเข้าเลือกใบจากรายการได้เลย ไม่ต้องใช้ไฟล์">บันทึกเข้าระบบ</button>
  <button class="btn" data-act="preview" id="btnPreview">ดูตัวอย่าง PDF</button>
  <button class="btn primary" data-act="export">ส่งออก PDF</button>
  <input type="file" id="openFile" accept=".json,application/json" hidden>
</div>
<main class="layout">
  <nav id="nav" class="edit-only" aria-label="หัวข้อในฟอร์ม"></nav>
  <div>
    <div id="alert"></div>
    <div id="form"></div>
    <div id="doc" class="doc"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

const PAJAMA_BOTTOM = { 'ขาสั้น':{ FS:'เอว 26–30 สะโพก 42 ยาว 15', PS:'เอว 30–38 สะโพก 48 ยาว 18' }, 'ขายาว':{ FS:'เอว 26–30 สะโพก 42 ยาว 38', PS:'เอว 30–38 สะโพก 48 ยาว 39' } };
function pajamaChart(v){
  const m=/^แขน(สั้น|ยาว)-ขา(สั้น|ยาว)$/.exec(v.style||'');
  if(!m&&/กระโปรง|สายเดี่ยว|Braless/.test(v.style||'')) return [];
  const tops=m?['แขน'+m[1]]:Object.keys(PAJAMA_TOP), bottoms=m?['ขา'+m[2]]:Object.keys(PAJAMA_BOTTOM);
  return ['FS','PS'].map(z=>`${z}: `+[...tops.map(t=>`เสื้อ${t} ${PAJAMA_TOP[t][z]}`), ...bottoms.map(b=>`กางเกง${b} ${PAJAMA_BOTTOM[b][z]}`)].join(' · ')+' นิ้ว');
}

function garment(o){
  const unit=o.unit||'ตัว';
  return { cat:'garment', name:o.name, unit, route:o.route, sections:[
    { title:'ผ้า', fields:[
      R('fabric','ชนิดผ้า',o.fabrics,{ other:true, hint:o.fabricHint }),
      T('fabric_color','สีผ้าพื้น',{ req:true, hint:o.colorHint }), FABRICS_MORE(),
      N('fabric_width','หน้าผ้า','นิ้ว'),
      ...(o.fabricExtra||[]),
    ]},
    { title:'แบบและแพทเทิร์น', fields:[...o.style, ...(o.pockets===false?[]:[POCKETS(o.pockets||POCKET_SHIRT)]), ...(o.styleAfter||[])] },
    sizeSec(o.sizes||['ไซซ์ผู้ใหญ่','ไซซ์เด็ก'], unit, { rowLabel:o.rowLabel, chart:o.sizeChart, measure:o.measure }),
    printSec(o.methods||M_GARMENT, o.positions===null?null:(o.positions||POS_SHIRT), { extra:[...(o.personal===false?[]:PERSONAL), ...(o.printExtra||[])], hint:o.printHint, def:o.printDef }),
    { title:'การเย็บ', fields:[...(o.sew||[ R('hem','ชายเสื้อ',['ลา 1 เข็ม','ลา 2 เข็ม','โพ้งริม']), THREAD ]), PIPING] },
    ...(o.labels===false?[]:[LABEL_SEC]),
    ...(o.extraSecs||[]),
    GARMENT_PACK,
  ]};
}

function scope(s){
  if(s==='h') return state.h;
  if(!state.p[state.product]){
    const v={}; allSecs().forEach(sec=>sec.fields.forEach(f=>{ if(f.def) v[f.id]=JSON.parse(JSON.stringify(f.def)); }));
    state.p[state.product]=v;
  }
  const v=state.p[state.product];
  if(typeof v.print_method==='string') v.print_method=[v.print_method]; // ข้อมูลรุ่นเก่าเลือกได้วิธีเดียว
  // ใบร่างก่อนแยกแพ็คเป็นถุงรายตัว + แพ็คใหญ่
  // เด็กเลือกที่ชุดไซซ์ ไม่ใช่ทรง
  if(Array.isArray(v.fit)) v.fit=v.fit.filter(x=>x!=='ทรงเด็ก');
  if(v.bag==='ถุงแยกตัว (1/1)') v.bag='แพ็ค 1/1 (ถุงแยกตัว)';
  if(v.bag==='ถุงรวมตามไซซ์'){ v.bag=''; v.outer_pack='แพ็คใส่ถุงใหญ่'; v.bigbag_split=['แยกถุงตามไซซ์']; }
  return v;
}
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = x => { const n=parseFloat(x); return isFinite(n)?n:0; };
const visible = (f,v) => !f.when || f.when(v);

function sizeCols(v){ return (v.size_sets||[]).flatMap(n=>SIZESETS[n]||[]); }
function allFields(){ return allSecs().flatMap(sec=>sec.fields); }
function rows(v,id,opt){ if(!Array.isArray(v[id])||(!opt&&!v[id].length)) v[id]=opt?[]:[{q:{}}]; return v[id]; }

// ยอดรวม: ตารางไซซ์ → ตารางรายการ (คอลัมน์ sum) → ช่องจำนวน
function totalQty(){
  const v=scope('p');
  for(const f of allFields()){
    if(!visible(f,v)) continue;
    if(f.type==='sizeTable'){ const cols=sizeCols(v); return rows(v,f.id).reduce((a,r)=>a+cols.reduce((b,c)=>b+num(r.q[c]),0),0); }
    if(f.type==='itemTable'){ const c=f.cols.find(c=>c.sum); if(c) return rows(v,f.id).reduce((a,r)=>a+num(r[c.c]),0); }
    if(f.id==='qty') return num(v.qty);
  }
  return 0;
}
// เส้นทางผลิตคิดจากเทคนิคที่เลือก (สินค้าที่ไม่ใช่งานผ้ากำหนดเส้นทางเองใน route)

const stdCell=(id,i,c,val)=>{ const on=val===c.std, a=`data-t="${id}" data-r="${i}" data-c="${c.c}"`;
  return `<div class="std-cell">${on?`<span>${esc(c.std)}</span>`:`<input type="text" ${a} value="${esc(val)}">`}<label class="std"><input type="checkbox" ${a} data-std="${esc(c.std)}" ${on?'checked':''}>มาตรฐาน</label></div>`; };
const WIDE=['check','sizeTable','itemTable','placements','images','textarea','dims'];
function fieldHTML(f,s,v){
  const val=v[f.id], a=`data-s="${s}" data-k="${f.id}"`;
  let b='';
  switch(f.type){
    case 'text': case 'date':
      b=`<input type="${f.type}" ${a} value="${esc(val)}" placeholder="${esc(f.ph||'')}">`; break;
    case 'number':
      b=`<input type="number" min="0" step="any" inputmode="decimal" ${a} value="${esc(val)}">`; break;
    case 'textarea':
      b=`<textarea rows="3" ${a}>${esc(val)}</textarea>`; break;
    case 'radio': case 'check': {
      const opts=f.options.concat(f.other?[OTHER]:[]);
      const on=o=>f.type==='radio'?val===o:(val||[]).includes(o);
      b=`<div class="opts">`+opts.map(o=>`<label class="opt"><input type="${f.type==='radio'?'radio':'checkbox'}" name="${s}_${f.id}" ${a} value="${esc(o)}" ${on(o)?'checked':''}><span>${esc(o)}</span></label>`).join('')+`</div>`;
      if(f.other&&on(OTHER)) b+=`<input type="text" class="other" data-s="${s}" data-k="${f.id}__other" value="${esc(v[f.id+'__other'])}" placeholder="ระบุ ${esc(f.label)}...">`;
      break; }
    case 'dims':
      b=`<div class="dims">`+f.parts.map((p,i)=>`<label><span>${esc(p)}</span><input type="number" min="0" step="any" data-s="${s}" data-k="${f.id}_${i}" value="${esc(v[f.id+'_'+i])}"></label>`).join('<b>×</b>')+`</div>`; break;
    case 'sizeTable': {
      const cols=sizeCols(v), rs=rows(v,f.id);
      if(!cols.length){ b=`<div class="hint">เลือกชุดไซซ์ก่อน</div>`; break; }
      b=`<div class="tbl-wrap"><table class="ft"><thead><tr><th>${esc(f.rowLabel||'แบบ / สี')}</th>${cols.map(c=>`<th>${c}</th>`).join('')}<th>รวม</th><th></th></tr></thead><tbody>`+
        rs.map((r,i)=>`<tr><td class="l"><input type="text" data-t="${f.id}" data-r="${i}" data-c="label" value="${esc(r.label)}" placeholder="เช่น สีขาว ลาย A"></td>`+
          cols.map(c=>`<td><input type="number" min="0" data-t="${f.id}" data-r="${i}" data-c="q:${esc(c)}" value="${esc(r.q[c])}"></td>`).join('')+
          `<td data-rt="${i}">0</td><td>${rs.length>1?`<button class="btn x" data-act="delrow" data-id="${f.id}" data-r="${i}" title="ลบแถว">✕</button>`:''}</td></tr>`).join('')+
        `</tbody><tfoot><tr><td>รวม</td>${cols.map(c=>`<td data-ct="${esc(c)}">0</td>`).join('')}<td data-gt>0</td><td></td></tr></tfoot></table></div>`+
        `<div class="tbl-actions"><button class="btn small ghost" data-act="addrow" data-id="${f.id}">+ เพิ่มแบบ/สี</button></div>`+
        sizeChart(f,v).map(l=>`<div class="hint">${esc(l)}</div>`).join('');
      break; }
    case 'itemTable': {
      const rs=rows(v,f.id,!!f.none);
      b=`<div class="tbl-wrap"><table class="ft"><thead><tr>${f.cols.map(c=>`<th>${c.label}</th>`).join('')}<th></th></tr></thead><tbody>`+
        rs.map((r,i)=>`<tr>${f.cols.map(c=>`<td class="${c.t!=='number'?'l':''}">`+(c.t==='select'
            ? `<select data-t="${f.id}" data-r="${i}" data-c="${c.c}"><option value="">— เลือก —</option>${c.options.map(o=>`<option ${r[c.c]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`
            : c.std ? stdCell(f.id,i,c,r[c.c])
            : `<input type="${c.t}" ${c.t==='number'?'min="0" step="any"':''} data-t="${f.id}" data-r="${i}" data-c="${c.c}" value="${esc(r[c.c])}">`)+`</td>`).join('')}<td>${rs.length>1||!f.req?`<button class="btn x" data-act="delrow" data-id="${f.id}" data-r="${i}" title="ลบแถว">✕</button>`:''}</td></tr>`).join('')+
        `</tbody>${f.cols.some(c=>c.sum)?`<tfoot><tr>${f.cols.map((c,j)=>`<td>${j===0?'รวม':c.sum?'<span data-gt>0</span>':''}</td>`).join('')}<td></td></tr></tfoot>`:''}</table></div>`+
        `<div class="tbl-actions"><button class="btn small ghost" data-act="addrow" data-id="${f.id}">${f.addLabel||'+ เพิ่มรายการ'}</button></div>`;

        `<div class="imgs">${state.imgs.map((m,i)=>`<figure><img src="${m.src}" alt=""><input class="cap" data-imgcap="${i}" value="${esc(m.name)}" aria-label="ชื่อใต้รูป" placeholder="ชื่อใต้รูป เช่น ผ้าตาข่าย"><button class="btn x" data-act="delimg" data-r="${i}" title="ลบภาพ">✕</button></figure>`).join('')}</div>`+coEditorHTML();
      break;
  }
  const wide=f.wide||(WIDE.includes(f.type))||(f.type==='radio'&&(f.options.length>3||f.other));
  return `<div class="field${wide?' wide':''}" id="fld_${s}_${f.id}"><div class="lab">${esc(f.label)}${f.req?'<i class="req">*</i>':''}${f.unit?` <small>(${esc(f.unit)})</small>`:''}</div>${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}${b}</div>`;
}

function updateTotals(){
  const v=scope('p'), P=prod(), t=totalQty();
  $('#qtyBadge').textContent=`${P.name.split(' ')[0]} · รวม ${t.toLocaleString()} ${P.unit}`;
  const st=allFields().find(f=>f.type==='sizeTable'&&visible(f,v));
  if(st){
    const cols=sizeCols(v), rs=rows(v,st.id);
    rs.forEach((r,i)=>{ const el=form.querySelector(`[data-rt="${i}"]`); if(el) el.textContent=cols.reduce((a,c)=>a+num(r.q[c]),0).toLocaleString(); });
    cols.forEach(c=>{ const el=form.querySelector(`[data-ct="${CSS.escape(c)}"]`); if(el) el.textContent=rs.reduce((a,r)=>a+num(r.q[c]),0).toLocaleString(); });
  }
  form.querySelectorAll('[data-gt]').forEach(el=>el.textContent=t.toLocaleString());
  updateProgress();
}
function updateProgress(){
  const m=validate(), cnt={};
  m.forEach(x=>cnt[x.sec]=(cnt[x.sec]||0)+1);
  $('#nav').innerHTML=`<div class="nh">หัวข้อ</div>`+layout().map(sec=>{ const c=cnt[sec.no]||0;
    return `<a href="#sec_${sec.no}" class="${c?'':'ok'}"><span class="n">${sec.no}</span><span class="t">${esc(sec.title)}</span><em>${c?'ขาด '+c:'✓'}</em></a>`; }).join('');
  const hard=m.filter(x=>x.hard).length, p=$('#progress');
  p.textContent=hard?`ต้องแก้ ${hard} ช่อง`:m.length?`ยังไม่กรอก ${m.length} ช่อง (ไม่บังคับ)`:'✓ ครบ พร้อมส่งออก';
  p.classList.toggle('done',!m.length); p.classList.toggle('soft',!hard&&m.length>0);
  if($('#alert').innerHTML){ missing=m; showAlert(); form.querySelectorAll('.field.missing').forEach(el=>el.classList.remove('missing')); markMissing(); }

// ย่อภาพให้ด้านยาวไม่เกิน 1600px เพื่อให้ PDF และไฟล์งานไม่ใหญ่เกินไป
function compress(file){ return new Promise(res=>{ const fr=new FileReader();
  fr.onload=()=>{ const img=new Image();
    img.onload=()=>{ const k=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); const g=c.getContext('2d');
      g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      res({ name:file.name, src:c.toDataURL('image/jpeg',0.85) }); };
    img.onerror=()=>res(null); img.src=fr.result; };
  fr.onerror=()=>res(null); fr.readAsDataURL(file); }); }
let readingImgs=0;
function rerender(){ const y=scrollY; renderForm(); scrollTo(0,y); save(); refreshThumb(); }
// ภาพแรก = รูปม็อคอัพบนการ์ดงานในระบบ · ย่อด้านยาว 800px (~100 KB) เพราะส่งผ่าน localStorage ที่พื้นที่น้อย
let thumb=null;
function refreshThumb(){
  const src=state.imgs[0]&&state.imgs[0].src;
  if(!src){ thumb=null; return; }
  if(thumb&&thumb.src===src) return;
  const img=new Image();
  img.onload=()=>{
    if(state.imgs[0]&&state.imgs[0].src===src&&(!state.co_size||state.co_size.w!==img.width||state.co_size.h!==img.height)){
      state.co_size={ w:img.width, h:img.height };
      const st=form.querySelector('[data-co-stage]'); if(st) st.outerHTML=coStageHTML(true);
      save();
    }
    const k=Math.min(1,800/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); const g=c.getContext('2d');
    g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
    // รูปที่เปิดจากระบบเป็นลิงก์ข้ามเว็บ ย่อไม่ได้ · ไม่ส่งรูปใหม่ ระบบใช้รูปเดิม (mockup_path)
    let data=null; try{ data=c.toDataURL('image/jpeg',0.8); }catch(e){}
    if(state.imgs[0]&&state.imgs[0].src===src) thumb={ src, data }; };
  img.onerror=()=>{ if(state.imgs[0]&&state.imgs[0].src===src) thumb={ src, data:null }; };
  img.src=src;
}

/* จุดกำกับ (Callout) บนภาพแรก · พิกัดเป็นสัดส่วนของภาพ (0–1) กล่องข้อความวางในขอบว่างรอบภาพได้
   CO_MX / CO_MY ต้องตรงกับ MARGIN_X / MARGIN_Y ใน app/src/proto/annotation.ts เพราะระบบนำจุดชุดนี้ไปสร้างม็อคอัพกำกับสเปก */
const CO_MX=0.25, CO_MY=0.08, CO_MAX=30;
const coClamp=(v,lo,hi)=>Math.min(hi,Math.max(lo,Number.isFinite(v)?v:0));
const coR4=v=>Math.round(v*10000)/10000;
const coPct=(x,y)=>`left:${(x+CO_MX)/(1+2*CO_MX)*100}%;top:${(y+CO_MY)/(1+2*CO_MY)*100}%`;
// เลื่อนกล่องตามตำแหน่งบนพื้นที่ภาพ ชิดซ้ายสุด = ขอบซ้ายกล่องอยู่ที่จุด ชิดขวาสุด = ขอบขวา กล่องจึงไม่ล้นออกนอกภาพ
const coBoxPct=(x,y)=>{ const l=(x+CO_MX)/(1+2*CO_MX)*100, t=(y+CO_MY)/(1+2*CO_MY)*100; return `left:${l}%;top:${t}%;transform:translate(-${l}%,-${t}%)`; };
function coList(){ if(!Array.isArray(state.callouts)) state.callouts=[]; return state.callouts; }
function coRefs(){
  const v=scope('p'), out=[], ms=[].concat(v.print_method||[]).filter(m=>!/ไม่มีลาย/.test(m));
  Object.entries(v.placements||{}).forEach(([pos,x])=>{ if(!x||!x.on) return;
    const val=[x.tech||(ms.length===1?ms[0]:''), x.size?x.size+' ซม.':'', x.note].filter(Boolean).join(' · ');
    out.push({ ref:'placement:'+pos, label:'ตำแหน่ง '+pos, val }); });
  [['neck','คอเสื้อ'],['neck_color','สีคอ'],['sleeve','แขน'],['fabric','ชนิดผ้า'],['fabric_color','สีผ้าพื้น']].forEach(([k,l])=>{
    const raw=v[k]; const val=Array.isArray(raw)?raw.filter(Boolean).join(', '):String(raw??'').trim();
    if(val) out.push({ ref:'field:'+k, label:l, val }); });
  return out;
}
function coLabel(c,refs){ const r=refs.find(x=>x.ref===c.ref); return [r?`${r.label}: ${r.val}`:'', c.body].filter(Boolean).join(' · '); }
function coBoxInner(c,i,refs){ const sub=coLabel(c,refs); return `<b>${i+1}</b> ${esc(c.title||'(ยังไม่ตั้งชื่อ)')}${sub?`<small>${esc(sub)}</small>`:''}`; }
function coStageHTML(edit){
  const m=state.imgs[0], sz=state.co_size||{w:4,h:3}, w=sz.w, h=sz.h, refs=coRefs(), cs=coList();
  const W=w*(1+2*CO_MX), H=h*(1+2*CO_MY);
  const lines=cs.map((c,i)=>`<line data-co-line="${i}" x1="${c.x*w}" y1="${c.y*h}" x2="${c.bx*w}" y2="${c.by*h}" stroke="#c08a3e" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`).join('');
  const dots=cs.map((c,i)=>edit
    ?`<button type="button" class="co-dot" data-co-i="${i}" data-co-part="pt" style="${coPct(c.x,c.y)}" aria-label="จุด ${i+1}"></button>`
    :'').join('');
  const boxes=cs.map((c,i)=>`<div class="co-box" ${edit?`data-co-i="${i}" data-co-part="box"`:''} style="${coBoxPct(c.bx,c.by)}">${coBoxInner(c,i,refs)}</div>`).join('');
  return `<div class="co-stage" ${edit?'data-co-stage':''} style="aspect-ratio:${W}/${H}">`+
    `<img src="${m.src}" alt="" ${edit?'data-co-img draggable="false"':''} style="left:${CO_MX/(1+2*CO_MX)*100}%;top:${CO_MY/(1+2*CO_MY)*100}%;width:${100/(1+2*CO_MX)}%;height:${100/(1+2*CO_MY)}%">`+
    `<svg viewBox="${-CO_MX*w} ${-CO_MY*h} ${W} ${H}" preserveAspectRatio="none">${lines}</svg>${dots}${boxes}</div>`;
}
function coEditorHTML(){
  if(!state.imgs[0]) return '';
  const refs=coRefs(), cs=coList();
  return `<div class="co"><p class="co-hint"><b>ชี้จุดบนภาพแรก (Callout)</b> · กดบนภาพ = เพิ่มจุด · ลากวงแหวนปลายเส้นหรือกล่องข้อความเพื่อย้าย (วางกล่องในขอบว่างรอบภาพ ไม่ให้บังลาย · ใน PDF เหลือแค่เส้นชี้) · จุดชุดนี้ไปขึ้นในระบบตอนรับงาน ไม่ต้องทำซ้ำ</p>`+
    coStageHTML(true)+
    (cs.length?`<ol class="co-list">`+cs.map((c,i)=>`<li><span class="co-n">${i+1}</span>`+
      `<input type="text" data-co="${i}" data-cf="title" value="${esc(c.title)}" placeholder="ชื่อจุด เช่น อกซ้าย (หน้า)">`+
      `<select data-co="${i}" data-cf="ref"><option value="">— อ้างตำแหน่ง / ช่องในใบนี้ —</option>${refs.map(r=>`<option value="${esc(r.ref)}" ${r.ref===c.ref?'selected':''}>${esc(r.label)}${r.val?': '+esc(r.val):''}</option>`).join('')}</select>`+
      `<input type="text" data-co="${i}" data-cf="body" value="${esc(c.body)}" placeholder="รายละเอียดเพิ่ม เช่น ขอบคอกว้าง 2 ซม.">`+
      `<button type="button" class="btn x" data-act="delco" data-r="${i}" title="ลบจุด">✕</button></li>`).join('')+`</ol>`:'')+
    `</div>`;
}
function coDocHTML(){
  const cs=coList(); if(!state.imgs[0]||!cs.length) return '';
  const refs=coRefs();
  return `<figure class="d-co">${coStageHTML(false)}<figcaption>${esc(state.imgs[0].name||'ภาพม็อคอัพ')} · จุดกำกับ ${cs.length} จุด</figcaption></figure><div class="d-mock">${esc(MOCKUP_NOTE)}</div>`+
    `<table class="dt"><thead><tr><th>#</th><th>จุด</th><th>รายละเอียด</th></tr></thead><tbody>`+
    cs.map((c,i)=>`<tr><td>${i+1}</td><td class="l">${esc(c.title)}</td><td class="l">${esc(coLabel(c,refs))}</td></tr>`).join('')+`</tbody></table>`;
}
let coDrag=null;
function coAt(e,part,stage){
  const r=stage.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*(1+2*CO_MX)-CO_MX, y=(e.clientY-r.top)/r.height*(1+2*CO_MY)-CO_MY;
  return part==='pt'?{x:coR4(coClamp(x,0,1)),y:coR4(coClamp(y,0,1))}:{x:coR4(coClamp(x,-CO_MX,1+CO_MX)),y:coR4(coClamp(y,-CO_MY,1+CO_MY))};
}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest&&e.target.closest('[data-co-part]'); if(!el||!el.closest('#form')) return;
  e.preventDefault(); el.setPointerCapture(e.pointerId);
  coDrag={ i:+el.dataset.coI, part:el.dataset.coPart, el, stage:el.closest('[data-co-stage]'), sx:e.clientX, sy:e.clientY, moved:false };
});
document.addEventListener('pointermove',e=>{
  if(!coDrag) return;
  if(!coDrag.moved&&Math.hypot(e.clientX-coDrag.sx,e.clientY-coDrag.sy)<4) return;
  coDrag.moved=true;
  const p=coAt(e,coDrag.part,coDrag.stage), c=coList()[coDrag.i], sz=state.co_size||{w:4,h:3}; if(!c) return;
  if(coDrag.part==='pt'){ c.x=p.x; c.y=p.y; } else { c.bx=p.x; c.by=p.y; }
  coDrag.el.style.cssText=coDrag.part==='pt'?coPct(p.x,p.y):coBoxPct(p.x,p.y);
  const ln=coDrag.stage.querySelector(`[data-co-line="${coDrag.i}"]`);
  if(ln){ ln.setAttribute(coDrag.part==='pt'?'x1':'x2',p.x*sz.w); ln.setAttribute(coDrag.part==='pt'?'y1':'y2',p.y*sz.h); }
});
document.addEventListener('pointerup',()=>{
  if(!coDrag) return;
  const d=coDrag; coDrag=null;
  if(d.moved){ save(); return; }
  form.querySelector(`[data-co="${d.i}"][data-cf="title"]`)?.focus();
});
document.addEventListener('pointercancel',()=>{ coDrag=null; });
function coAdd(e){
  const cs=coList(); if(cs.length>=CO_MAX){ alert(`ใส่จุดได้ไม่เกิน ${CO_MAX} จุดต่อใบ`); return; }
  const p=coAt(e,'pt',e.target.closest('[data-co-stage]'));
  cs.push({ x:p.x, y:p.y, bx:coR4(p.x<0.5?-CO_MX/2:1+CO_MX/2), by:coR4(coClamp(p.y,-CO_MY,1+CO_MY)), title:'', ref:'', body:'' });
  rerender();
  form.querySelector(`[data-co="${cs.length-1}"][data-cf="title"]`)?.focus();
}

form.addEventListener('input',e=>{
  const t=e.target, d=t.dataset;
  if(t.type==='radio'||t.type==='checkbox'||t.type==='file') return;
  if(d.imgcap!==undefined){ const m=state.imgs[+d.imgcap]; if(m){ m.name=t.value; save(); } return; }
  if(d.co!==undefined){ const c=coList()[+d.co]; if(!c) return; c[d.cf]=t.value;
    const box=form.querySelector(`.co-box[data-co-i="${d.co}"]`); if(box) box.innerHTML=coBoxInner(c,+d.co,coRefs()); save(); return; }
  if(t.id==='psearch'){ const q=t.value.trim().toLowerCase();
    form.querySelectorAll('.pcat').forEach(c=>{ let any=false;
      c.querySelectorAll('[data-name]').forEach(l=>{ const ok=!q||l.dataset.name.toLowerCase().includes(q); l.style.display=ok?'':'none'; any=any||ok; });
      c.style.display=any?'':'none'; }); return; }
  if(d.k){ scope(d.s)[d.k]=t.value; }
  else if(d.t){ const r=scope('p')[d.t][+d.r]; if(d.c.startsWith('q:')) r.q[d.c.slice(2)]=t.value; else r[d.c]=t.value; }
  else if(d.pl){ const v=scope('p'); v[d.pl]=v[d.pl]||{}; (v[d.pl][d.pos]=v[d.pl][d.pos]||{})[d.pf]=t.value; }
  t.closest('.field')?.classList.remove('missing');
  updateTotals(); save();
});
form.addEventListener('change',e=>{
  const t=e.target, d=t.dataset;
  if(d.product!==undefined){ state.product=t.value; state.pickOpen=false; scope('p'); return rerender(); }
  if(t.type==='radio'&&d.k){ scope(d.s)[d.k]=t.value; return rerender(); }
  if(t.type==='checkbox'&&d.k){ const v=scope(d.s); const arr=new Set(v[d.k]||[]); t.checked?arr.add(t.value):arr.delete(t.value); v[d.k]=[...arr]; return rerender(); }
  if(t.type==='checkbox'&&d.std!==undefined){ scope('p')[d.t][+d.r][d.c]=t.checked?d.std:''; return rerender(); }
  if(t.type==='checkbox'&&d.pl){ const v=scope('p'); v[d.pl]=v[d.pl]||{}; (v[d.pl][d.pos]=v[d.pl][d.pos]||{}).on=t.checked; return rerender(); }
  if(t.type==='file'&&d.img!==undefined){
    const files=[...t.files]; readingImgs++;
    Promise.all(files.map(compress)).then(a=>{
      const bad=files.filter((f,i)=>!a[i]).map(f=>f.name);
      state.imgs.push(...a.filter(Boolean)); t.value=''; readingImgs--; rerender();
      if(bad.length) alert(`เปิดเป็นรูปไม่ได้: ${bad.join(', ')}\nเลือกไฟล์รูป JPG / PNG / WEBP ใหม่อีกครั้ง`);
    });
  }
});
document.addEventListener('click',e=>{
  if(e.target.matches&&e.target.matches('[data-co-img]')){ coAdd(e); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, v=scope('p');
  if(act==='pick'){ state.pickOpen=true; rerender(); setTimeout(()=>$('#psearch')?.focus(),0); }
  if(act==='addrow'){ v[b.dataset.id].push(b.dataset.id==='sizes'?{q:{}}:{}); rerender(); }
  if(act==='delrow'){ v[b.dataset.id].splice(+b.dataset.r,1); rerender(); }
  if(act==='delimg'){ const r=+b.dataset.r;
    if(r===0&&coList().length&&!confirm(`ภาพแรกมีจุดกำกับ ${coList().length} จุด ลบภาพแล้วจุดจะหายด้วย ลบต่อ?`)) return;
    if(r===0){ state.callouts=[]; state.co_size=null; }
    state.imgs.splice(r,1); rerender(); }
  if(act==='delco'){ coList().splice(+b.dataset.r,1); rerender(); }
  if(act==='new'){ if(confirm('ล้างข้อมูลทั้งหมดและเริ่มใบใหม่?\n(ถ้ายังไม่ได้กด "บันทึกไฟล์" ข้อมูลใบนี้จะหาย)')){ state=fresh(); missing=[]; $('#alert').innerHTML=''; rerender(); scrollTo(0,0); } }
  if(act==='open'){ if(!(state.h.doc_no||state.h.customer)||confirm('เปิดไฟล์แล้วข้อมูลที่กรอกอยู่จะถูกแทนที่ ดำเนินการต่อ?')) $('#openFile').click(); }
  if(act==='savefile'){ const blob=new Blob([JSON.stringify({ app:'phappim-confirm', v:1, ...state, summary:{ qty:totalQty() } })],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fileBase()+'.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('บันทึกไฟล์ '+a.download+' แล้ว'); }
  if(act==='savedb'){ saveToSystem(); }
  if(act==='preview'){ togglePreview(); }
  if(act==='export'){ exportPdf(); }
});

function loadData(d, label){
  if(!d||!d.h||!d.p||!PRODUCTS[d.product]) return false;
  state={ h:d.h, product:d.product, pickOpen:false, p:d.p, imgs:Array.isArray(d.imgs)?d.imgs:[], callouts:Array.isArray(d.callouts)?d.callouts:[], co_size:d.co_size||null }; missing=[];
  if(typeof d.mockup_path==='string'&&d.mockup_path){ state.mockup_path=d.mockup_path; state.mockup_no=String(d.h.doc_no||'').trim(); } $('#alert').innerHTML='';
  if(d.from_job) state.job_no=String(d.h.doc_no||'').trim();
  if(document.body.classList.contains('preview')) togglePreview(false); rerender(); scrollTo(0,0); save(); toast(label);

}
$('#openFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return;

/* ฟอร์มอยู่เว็บเดียวกับระบบ จึงส่งใบผ่าน localStorage ให้หน้าระบบที่ล็อกอินแล้วบันทึก ฟอร์มไม่ต้องล็อกอินเอง */
const OUTBOX='pp142.confirmation.outbox', INBOX='pp142.confirmation.inbox';
function saveToSystem(){
  if(location.protocol==='file:'){ alert('บันทึกเข้าระบบได้เมื่อเปิดฟอร์มจากเว็บระบบ (pp142.pages.dev/confirmation)\nตอนนี้เปิดจากไฟล์ในเครื่อง ให้ใช้ "บันทึกไฟล์" แทน'); return; }
  if(!String(state.h.doc_no||'').trim()){ alert('ใส่เลขที่ใบยืนยันก่อนบันทึกเข้าระบบ'); $('[data-k="doc_no"]')?.focus(); return; }
  if(state.job_no&&state.job_no===String(state.h.doc_no).trim()){ alert('ใบ '+state.job_no+' รับงานเข้าโรงงานแล้ว ไม่ต้องบันทึกเข้าระบบ\nกด "ส่งออก PDF" ให้ลูกค้าเซ็น แล้วแนบ PDF ใบใหม่ที่รายละเอียดงาน → "ลูกค้าขอแก้ใบยืนยัน"'); return; }
  // รูปที่เพิ่งเลือกยังอ่าน/ย่อไม่เสร็จ = ไม่ส่ง ไม่อย่างนั้นใบไปถึงระบบโดยไม่มีรูป
  const first=state.imgs[0]&&state.imgs[0].src;

  if(w){ toast('ส่งใบ '+state.h.doc_no+' ไปบันทึกที่หน้าระบบแล้ว · ดูผลที่แท็บระบบ'); return; }
  const t=$('#toast'); t.textContent='ส่งใบ '+state.h.doc_no+' แล้ว · ถ้าแท็บระบบไม่เปิดขึ้นมา';

const SIZE_KEYS=new Set(['size','chest','length','sleeve','waist','hip','leg','w','h','qty']);
// "28-34" เป็นช่วง ไม่ใช่ติดลบ · ติดลบ = ขึ้นต้นด้วยลบ หรือลบหลังเครื่องหมายคูณ
const negative = x => /^[-−]\s*\d|[×x*]\s*[-−]\s*\d/i.test(String(x??'').trim());
function negativeIn(f,v){
  const val=v[f.id];
  switch(f.type){
    case 'number': return negative(val);
    case 'dims': return f.parts.some((p,i)=>negative(v[f.id+'_'+i]));
    case 'sizeTable': return rows(v,f.id).some(r=>Object.values(r.q||{}).some(negative));
    case 'itemTable': return rows(v,f.id,!!f.none).some(r=>f.cols.some(c=>(c.t==='number'||SIZE_KEYS.has(c.c))&&negative(r[c.c])));
    case 'placements': return Object.values(val||{}).some(x=>x.on&&negative(x.size));
  }
  return false;
}
function validate(){
  const out=[];
  layout().filter(sec=>sec.fields).forEach(sec=>{ const s=sec.s, v=scope(s); sec.fields.forEach(f=>{
    if(!visible(f,v)) return;
    const val=v[f.id]; let bad=false, why='';
    switch(f.type){
      case 'text': case 'date': case 'textarea': bad=f.req&&!String(val??'').trim(); break;
      case 'number': bad=f.req&&!(num(val)>0); break;
      case 'radio': bad=(f.req&&!val)||(val===OTHER&&!String(v[f.id+'__other']??'').trim()); if(bad&&val===OTHER) why='ระบุรายละเอียด "อื่นๆ"'; break;
      case 'check': bad=(f.req&&!(val||[]).length)||((val||[]).includes(OTHER)&&!String(v[f.id+'__other']??'').trim()); break;
      case 'dims': bad=f.req&&f.parts.some((p,i)=>i<2&&!(num(v[f.id+'_'+i])>0)); break;
      case 'sizeTable': { const cols=sizeCols(v), rs=rows(v,f.id);
        const tot=r=>cols.reduce((a,c)=>a+num(r.q[c]),0);
        if(!rs.some(r=>tot(r)>0)){ bad=true; why='ยังไม่มีจำนวน'; }
        else if(rs.some(r=>tot(r)>0&&!String(r.label??'').trim())){ bad=true; why='ใส่ชื่อแบบ/สีให้ทุกแถวที่มีจำนวน'; }
        break; }
      case 'itemTable': { const rs=rows(v,f.id,!!f.none);
        const full=r=>f.cols.filter(c=>!c.opt).every(c=>c.t==='number'?num(r[c.c])>0:String(r[c.c]??'').trim());
        const empty=r=>f.cols.every(c=>!String(r[c.c]??'').trim());
        if(f.req&&!rs.some(full)){ bad=true; why='ต้องมีอย่างน้อย 1 รายการที่กรอกครบ'; }
        else if(rs.some(r=>!full(r)&&!empty(r))){ bad=true; why='มีแถวที่กรอกไม่ครบ'; }
        break; }
      case 'placements': { const on=Object.entries(val||{}).filter(([,x])=>x.on);
        if(!on.length){ bad=true; why='ติ๊กอย่างน้อย 1 ตำแหน่ง'; }
        else if(on.some(([,x])=>!String(x.size??'').trim())){ bad=true; why='ใส่ขนาดให้ทุกตำแหน่งที่ติ๊ก'; }
        else if([].concat(v.print_method||[]).filter(m=>!/ไม่มีลาย/.test(m)).length>1&&on.some(([,x])=>!String(x.tech??'').trim())){ bad=true; why='เลือกไว้หลายเทคนิค ต้องระบุเทคนิคของแต่ละตำแหน่ง'; }
        break; }
      case 'images': bad=f.req&&!state.imgs.length; break;
    }
    if(negativeIn(f,v)){ out.push({ id:`fld_${s}_${f.id}`, sec:sec.no, label:`${sec.title} › ${f.label}`, why:'มีขนาดหรือจำนวนติดลบ แก้เป็นค่าบวก', hard:true }); return; }
    if(bad) out.push({ id:`fld_${s}_${f.id}`, sec:sec.no, label:`${sec.title} › ${f.label}`, why, hard:s==='h'&&MUST_FILL.includes(f.id) });
  }); });
  if(state.h.issue_date&&state.h.due_date&&state.h.due_date<state.h.issue_date) out.push({id:'fld_h_due_date',sec:2,label:'ข้อมูลใบงาน › กำหนดส่งงาน',why:'อยู่ก่อนวันที่ออกใบ',hard:true});
  if(state.h.sample_date&&state.h.due_date&&state.h.sample_date>state.h.due_date) out.push({id:'fld_h_sample_date',sec:2,label:'ข้อมูลใบงาน › วันนัดส่งตัวอย่าง',why:'อยู่หลังกำหนดส่งงาน',hard:true});
  return out;
}

function thDate(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return `${+d}/${+m}/${+y+543}`; }
// ค่าที่แปลว่า "ไม่มี / ไม่ต้องทำ" ไม่พิมพ์ลง PDF เพื่อไม่ให้ฝ่ายผลิตสับสน
const isNone = s => { const t=String(s??'').trim(); return !t || /^(-|—|ไม่มี|ไม่ต้อง)$/.test(t) || /^ไม่มี\s*\(/.test(t) || (/^ไม่มี/.test(t) && !/\(/.test(t)); };
function valText(f,v){
  const val=v[f.id], o=x=>x===OTHER?`${OTHER}: ${v[f.id+'__other']||''}`:x;
  switch(f.type){
    case 'date': return val?thDate(val):'';
    case 'number': return num(val)>0?`${val}${f.unit?' '+f.unit:''}`:'';
    case 'radio': return val&&!isNone(val)?o(val):'';
    case 'check': return (val||[]).filter(x=>!isNone(x)).map(o).join(', ');
    case 'dims': {
      // ช่องที่ใส่หน่วยในวงเล็บเอง เช่น "หนา (มม.)" แสดงหน่วยของตัวเองแยกจากหน่วยหลัก
      const ps=f.parts.map((p,i)=>{ const m=/^(.*?)\s*\(([^)]+)\)$/.exec(p); return { name:m?m[1]:p, unit:m?m[2]:'', x:v[f.id+'_'+i] }; }).filter(p=>num(p.x)>0);
      const main=ps.filter(p=>!p.unit), own=ps.filter(p=>p.unit);
      return [main.length?main.map(p=>`${p.name} ${p.x}`).join(' × ')+(f.unit?' '+f.unit:''):'', ...own.map(p=>`${p.name} ${p.x} ${p.unit}`)].filter(Boolean).join(' · '); }
    default: { const t=String(val??'').trim(); return isNone(t)?'':t; }
  }
}
function kvHTML(fs,v){
  const items=fs.map(f=>{ const t=valText(f,v); return t?`<div class="${f.type==='textarea'||t.length>40?'w':''}"><span>${esc(f.label.replace(/ \(.*\)$/,''))}</span><b>${esc(t)}</b></div>`:''; }).join('');
  return items?`<div class="kv">${items}</div>`:'';
}

    <div class="sign">${sig('ลูกค้ายืนยันรายละเอียด')}${sig('แอดมินผู้ทำใบ')}${sig('ผู้ควบคุมงาน (รับงานเข้าโรงงาน)')}</div></div>`;

  // ใช้ thead ของตารางเป็นหัวกระดาษ: เบราว์เซอร์จะพิมพ์ thead ซ้ำทุกหน้าเมื่อเนื้อหายาวเกิน 1 หน้า
  $('#doc').innerHTML=`<table class="pg"><thead><tr><td>${head}</td></tr></thead><tbody><tr><td>${x}</td></tr></tbody></table>`;
  setPageStyle();
  estimatePages();
}
// ประมาณจำนวนหน้า A4 (พื้นที่พิมพ์ 190 × 274 มม. หักหัวกระดาษที่พิมพ์ซ้ำทุกหน้า) · เป้าหมายไม่เกิน 2 หน้า
function estimatePages(){
  const d=$('#doc'), t=d.querySelector('table.pg'); if(!t) return;
  const prev=d.style.display; d.style.display='block'; t.style.width='190mm';
  const probe=document.createElement('div'); probe.style.cssText='position:absolute;visibility:hidden;height:100mm;width:1px';
  document.body.appendChild(probe); const mm=probe.offsetHeight/100; probe.remove();
  const headH=t.tHead.offsetHeight, bodyH=t.tBodies[0].offsetHeight, per=274*mm-headH;
  const pages=Math.max(1,Math.ceil(bodyH/per*1.03));
  t.style.width=''; d.style.display=prev;
  let n=$('#pageNote'); if(!n){ n=document.createElement('div'); n.id='pageNote'; d.parentNode.insertBefore(n,d); }
  n.className='page-note'+(pages>2?' warn':'');
  n.textContent=pages>2?`ประมาณ ${pages} หน้า A4 · เกินเป้า 2 หน้า ลองลดจำนวนภาพ หรือรวมแถวในตาราง`:`ประมาณ ${pages} หน้า A4 · ทุกหน้ามีโลโก้ เลขที่ใบ ลูกค้า และชื่องาน`;
}
function setPageStyle(){
  const h=state.h, q=t=>String(t||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ');
  const left=`${COMPANY.name} · ใบยืนยันการผลิต ${h.doc_no||''}${num(h.rev)>0?' แก้ไขครั้งที่ '+h.rev:''} · ${h.customer||''}`;
  const box='font-family:"Noto Sans Thai","Sarabun",sans-serif;font-size:8.5pt;color:#555;';
  let st=document.getElementById('pageStyle');
  if(!st){ st=document.createElement('style'); st.id='pageStyle'; document.head.appendChild(st); }
  st.textContent=`@page{size:A4;margin:10mm 10mm 13mm;`+
    `@bottom-left{content:"${q(left)}";${box}}`+
    `@bottom-right{content:"หน้า " counter(page) " / " counter(pages);${box}}}`;
}
function togglePreview(force){
  const on=force??!document.body.classList.contains('preview');
  if(on){ renderDoc(); missing=validate(); showAlert(); updateTotals(); }
  document.body.classList.toggle('preview',on);
  $('#btnPreview').textContent=on?'กลับไปแก้ไข':'ดูตัวอย่าง PDF';
  if(!on) rerender();
  scrollTo(0,0);
}
// ฟอนต์เว็บโหลดเมื่อมีตัวอักษรใช้จริง · เอกสารซ่อนอยู่จนกดพิมพ์ จึงต้องรอให้โหลดก่อน ไม่งั้น PDF ออกเป็นฟอนต์สำรอง
function docFontsReady(){
  if(!document.fonts) return Promise.resolve();
  const w=['400','500','600','700'].map(x=>document.fonts.load(`${x} 12px "Noto Sans Thai"`,'ใบยืนยัน'));
  return Promise.race([Promise.all(w),new Promise(r=>setTimeout(r,4000))]);
}
docFontsReady();
async function exportPdf(){
  missing=validate(); showAlert();
  const hard=missing.filter(m=>m.hard).length, soft=missing.length-hard;
  const back=()=>{ if(document.body.classList.contains('preview')) togglePreview(false); else rerender(); scrollTo(0,0); };
  if(hard){ back(); return; }
  if(soft&&!confirm(`ยังไม่ได้กรอก ${soft} ช่อง (ไม่บังคับ)\nช่องที่ว่างจะไม่พิมพ์ลง PDF\n\nกด "ตกลง" = ส่งออก PDF เลย · "ยกเลิก" = กลับไปดูช่องที่ว่าง`)){ back(); return; }
  renderDoc();
  await docFontsReady();
  const old=document.title;
  document.title=fileBase();
  window.print();
  document.title=old;
}

document.getElementById('barLogo').src=COMPANY.logo;
renderForm();
refreshThumb();
</script>

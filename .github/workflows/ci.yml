# ตรวจฐานข้อมูลและตรวจ lint, test, build ของหน้าเว็บทุกครั้งที่ push หรือเปิด PR
name: ci
on:
  push:
  pull_request:
jobs:
  db-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: supabase/tests } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
  files-worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: workers/files } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test
  r2-backup:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tools/r2-backup } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test
  app-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

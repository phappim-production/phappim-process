<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>มาตรฐานสถานีการผลิต · ภาพพิมพ์ 142</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1b2320; --muted:#5d6862; --faint:#8c968f; --rule:#cfd6d0; --rule-strong:#9fb0a6;
    --band:#f1f4f1; --brand:#0f4a42; --brand-2:#e4efeb; --accent:#a8691b; --accent-2:#fbf1e1; --red:#a8261d;
  }
  * { box-sizing:border-box; }
  html { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body { margin:0; background:#d9ddd8; color:var(--ink); font:12px/1.42 "Sarabun", system-ui, sans-serif; }

  /* แถบเครื่องมือ (เฉพาะจอ) */
  .toolbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:10px 18px; background:var(--brand); color:#fff; }
  .toolbar strong { font-size:15px; }
  .toolbar button { margin-left:auto; padding:7px 16px; border:0; border-radius:6px; background:#fff; color:var(--brand); font:600 13px "Sarabun"; cursor:pointer; }

  /* หน้า A4 */
  .page { position:relative; display:flex; flex-direction:column; width:210mm; height:297mm; margin:18px auto; padding:13mm 15mm 11mm; background:#fff; box-shadow:0 1px 8px rgba(0,0,0,.15); overflow:hidden; }
  .running { display:flex; justify-content:space-between; padding-bottom:5px; margin-bottom:12px; border-bottom:1px solid var(--rule); font-size:10.5px; color:var(--muted); }
  .running b { color:var(--brand); font-weight:600; }
  .foot { margin-top:auto; padding-top:6px; border-top:1px solid var(--rule); display:flex; justify-content:space-between; font-size:10.5px; color:var(--faint); }

  h1 { margin:0; font-size:26px; line-height:1.25; color:var(--brand); }
  h2 { margin:0 0 8px; font-size:18px; color:var(--brand); }
  h2 .no { display:inline-block; min-width:30px; color:var(--accent); }
  h3 { margin:12px 0 5px; font-size:13.5px; font-weight:700; }
  p { margin:0 0 5px; }
  .muted { color:var(--muted); } .small { font-size:11px; }
  .lead { font-size:13.5px; color:var(--muted); }

  table { width:100%; border-collapse:collapse; }
  th, td { padding:3px 6px; border:1px solid var(--rule); vertical-align:top; text-align:left; }
  thead th { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; font-size:11.5px; }
  tbody th { background:var(--band); font-weight:600; }
  tr.group td { background:var(--brand-2); color:var(--brand); font-weight:700; font-size:11.5px; padding:3px 6px; }
  td.n { width:26px; text-align:center; color:var(--muted); }
  td.chk, th.chk { width:52px; text-align:center; white-space:nowrap; }
  td.rec { width:84px; }
  td.blank { height:22px; }
  td.detail { font-size:11.5px; color:#2c3530; }
  .step { font-weight:600; }
  .num { font-variant-numeric:tabular-nums; }

  .rec-tag { display:inline-block; padding:0 6px; border-radius:3px; font-size:10.5px; font-weight:600; white-space:nowrap; }
  .r-req { background:#f8e3e0; color:var(--red); } .r-num { background:#e3ecf6; color:#23578c; }
  .r-appr { background:var(--accent-2); color:var(--accent); } .r-lock { background:#ece4f4; color:#5f3784; }
  .r-opt { background:var(--band); color:var(--muted); }

  .field { display:inline-block; min-width:110px; border-bottom:1px solid var(--rule-strong); }
  .field.s { min-width:46px; } .field.l { min-width:190px; }
  .cb::before { content:"☐"; margin-right:3px; }
  .cb { margin-right:12px; white-space:nowrap; }

  .meta { display:grid; grid-template-columns:repeat(4, 1fr); border:1px solid var(--rule); margin-bottom:8px; }
  .meta div { padding:5px 8px; border-right:1px solid var(--rule); }
  .meta div:last-child { border-right:0; }
  .meta span { display:block; font-size:10.5px; color:var(--muted); }
  .meta b { font-weight:600; }
  .io { display:grid; grid-template-columns:1fr 18px 1fr; align-items:stretch; margin-bottom:6px; }
  .io > div { padding:5px 8px; border:1px solid var(--rule); background:var(--band); }
  .io > i { display:grid; place-items:center; font-style:normal; color:var(--brand); font-weight:700; }
  .io span { display:block; font-size:10.5px; color:var(--muted); }

  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .panel { border:1px solid var(--rule); }
  .panel h4 { margin:0; padding:4px 8px; background:var(--band); border-bottom:1px solid var(--rule); font-size:11.5px; }
  .panel ul { margin:0; padding:5px 8px 6px 24px; }
  .panel li { margin:1px 0; }
  .panel .body { padding:5px 8px; }
  .notes { border:1px solid var(--rule); padding:4px 8px; }
  .notes .ln { height:20px; border-bottom:1px dotted var(--rule-strong); }
  .notes .ln:last-child { border-bottom:0; }
  .callout { padding:8px 10px; border-left:4px solid var(--accent); background:var(--accent-2); }
  .callout.brand { border-color:var(--brand); background:var(--brand-2); }

  /* ผังขั้นตอน */
  .flow { display:flex; align-items:stretch; gap:0; margin:6px 0 4px; }
  .flow .st { flex:1; padding:6px 4px; border:1px solid var(--rule-strong); border-radius:4px; text-align:center; font-weight:600; font-size:11.5px; background:#fff; }
  .flow .st small { display:block; font-weight:400; color:var(--muted); font-size:10px; }
  .flow .arw { width:14px; display:grid; place-items:center; color:var(--muted); }
  .flow .grp { flex:3.4; display:flex; flex-direction:column; border:2px solid var(--brand); border-radius:6px; padding:4px; background:var(--brand-2); }
  .flow .grp .row { display:flex; }
  .flow .grp .cap { text-align:center; font-weight:700; color:var(--brand); font-size:11.5px; margin-top:3px; }
  .flow .st.pre { background:var(--band); }

  .cover-title { margin:26mm 0 6mm; }
  .cover-title .kicker { font-size:13px; letter-spacing:.06em; color:var(--accent); font-weight:600; }
  .doc-control td, .doc-control th { padding:6px 8px; }
  .sign td { height:46px; }

  @media print {
    body { background:#fff; }
    .toolbar { display:none; }
    .page { margin:0; box-shadow:none; width:auto; height:auto; min-height:277mm; padding:0; overflow:visible; break-after:page; }
    .page:last-child { break-after:auto; }
    @page { size:A4; margin:11mm 13mm 9mm; }
  }
  @media screen and (max-width:840px) {
    .page { width:auto; height:auto; margin:8px; padding:16px; overflow-x:auto; }
  }
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]))
const rec = k => `<span class="rec-tag r-${k}">${REC[k]}</span>`
const pages = []
const page = (section, body) => pages.push({ section, body })

function sopTable(steps) {
  let n = 0
  const rows = steps.map(s => {
    if (s.length === 1) return `<tr class="group"><td colspan="5">${esc(s[0])}</td></tr>`
    n++
    return `<tr><td class="n">${n}</td><td class="step">${esc(s[0])}</td><td class="detail">${s[1]}</td><td class="rec">${rec(s[2])}</td><td class="chk"><span class="cb"></span><span class="cb" style="margin:0"></span></td></tr>`
  }).join('')
  return `<table>
    <thead><tr><th style="width:26px">#</th><th style="width:23%">ขั้นตอน</th><th>รายละเอียด / จุดควบคุม</th><th style="width:84px">บันทึกในระบบ</th><th class="chk">ถูก · แก้</th></tr></thead>
    <tbody>${rows}</tbody></table>`
}

const pairs = a => a.reduce((r, x, i) => (i % 2 ? r[r.length - 1].push(x) : r.push([x]), r), [])

function stationPage(s, i) {

    <div class="meta">
      <div><span>สายการผลิต</span><b>${s.line}</b></div>
      <div><span>เวลามาตรฐาน (ร่าง)</span><b>${s.budget}</b></div>
      <div><span>หัวหน้าสถานี</span><span class="field"></span></div>
      <div><span>คนกดในระบบ</span><span class="field"></span></div>
    </div>
    <p class="muted">${s.purpose}</p>
    <div class="io"><div><span>รับเข้า</span>${s.input}</div><i>→</i><div><span>ส่งออก</span>${s.output}</div></div>
    ${sopTable(s.steps)}
    <div class="two" style="margin-top:8px">
      <div class="panel"><h4>ค่าที่ต้องบันทึก</h4><ul>${s.records.map(r => `<li>${r}</li>`).join('')}</ul></div>
      <div class="panel"><h4>ปัญหาคุณภาพที่พบบ่อย (ติ๊กที่เจอจริง)</h4><div class="body">${s.defects.map(d => `<span class="cb">${d}</span>`).join(' ')}</div></div>
    </div>
    <table style="margin-top:8px"><thead><tr><th colspan="4">ข้อมูลกำลังผลิต (กรอกจากหน้างาน)</th></tr></thead>
      <tbody>${pairs(s.capacity.map(([k]) => k)).map(([a, b]) => `<tr><th style="width:30%">${a}</th><td style="width:20%"></td><th style="width:30%">${b ?? ''}</th><td style="width:20%"></td></tr>`).join('')}</tbody></table>
    <h3>ขั้นตอนที่ขาด / แก้ไข</h3>
    <div class="notes"><div class="ln"></div><div class="ln"></div></div>
  `)
}

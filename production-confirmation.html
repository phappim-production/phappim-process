<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ใบยืนยันการผลิต</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2; --card:#fff; --ink:#1d2420; --muted:#5f6a63; --line:#dfe3dd;
  --accent:#0b3e3d; --accent-soft:#e3efee; --warn:#b4231b; --warn-soft:#fdecea; --caution:#9a5b00; --caution-soft:#fff4e0; --gold:#c08a3e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}

.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar-logo{height:38px;width:auto;display:block}
.bar h1{font-size:17px;margin:0;flex:1;min-width:180px}
.bar h1 small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.qty-badge{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{border-style:dashed;color:var(--accent)}
.btn.x{border:none;background:none;color:var(--muted);padding:4px 8px}
.btn.x:hover{color:var(--warn)}

main.layout{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
body.preview main.layout{grid-template-columns:minmax(0,1fr)}
#nav{position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;max-height:calc(100vh - 92px);overflow:auto}
#nav .nh{font-weight:700;padding:4px 8px 8px;color:var(--muted);font-size:13px}
#nav a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none}
#nav a:hover{background:var(--accent-soft)}
#nav a .n{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e9ecea;font-size:12px}
#nav a.ok .n{background:var(--accent);color:#fff}
#nav a span.t{flex:1}
#nav a em{font-style:normal;font-size:12px;color:var(--warn);font-weight:600;white-space:nowrap}
#nav a.ok em{color:var(--accent)}
.progress{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.progress.done{background:var(--accent-soft);color:var(--accent)}
.progress.soft{background:var(--caution-soft);color:var(--caution)}
.card{scroll-margin-top:80px}
.field{scroll-margin-top:90px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:10;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.toast.link{pointer-events:auto}.toast a{color:#fff;font-weight:700;text-decoration:underline;margin-left:8px;display:inline-block;padding:6px 0}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 12px;display:flex;gap:8px;align-items:center}
.card h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px}
/* minmax(0,1fr): 1fr ยืดตามตารางกว้างจนหัวข้อล้นจอมือถือ · ตารางเลื่อนใน .tbl-wrap เอง */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.field.wide{grid-column:1/-1}
.lab{font-weight:600;font-size:14px;margin-bottom:4px}
.lab small{font-weight:400;color:var(--muted)}
.lab-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.lab-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.lab-row .lab{margin-bottom:0}
.na-btn{flex-shrink:0;min-height:32px;padding:4px 10px;font-size:13px;color:var(--muted)}
.lab-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.unit-sw{display:inline-flex;flex-shrink:0;margin-bottom:4px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.unit-sw button{min-height:36px;min-width:48px;padding:4px 10px;border:none;background:var(--card);font-size:13px;cursor:pointer}
.unit-sw button+button{border-left:1px solid var(--line)}
.unit-sw button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.na-box{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;color:var(--muted);background:#f7f8f6}
.req{color:var(--warn);font-style:normal;margin-left:2px}
.hint{color:var(--muted);font-size:13px;margin:-2px 0 6px}
input[type=text],input[type=number],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
input:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
input:disabled{background:#f2f3f1;color:#9aa39d}
.opts{--opt-min:190px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--opt-min),1fr));gap:8px}
.opt{display:flex;align-items:flex-start;gap:8px;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;background:var(--card);user-select:none}
.opt>span{flex:1;min-width:0;line-height:1.4}
.opts.has-desc{--opt-min:220px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.opt input{accent-color:var(--accent);margin:3px 0 0;flex:none}
.opt.big{padding:10px 16px;font-size:15px}
.opt .desc{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.35;margin-top:1px}
.opt .optimg{display:block;width:96px;height:96px;object-fit:cover;border-radius:6px;margin-top:6px;border:1px solid var(--line)}
.other{margin-top:6px}
.dims{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.dims label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);width:120px}
.dims b{padding-bottom:8px;color:var(--muted)}
.route{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:#faf6ec;border:1px solid #efe2c2;font-size:14px}
.route b{color:var(--gold)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.ft{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
table.ft th,table.ft td{border-bottom:1px solid var(--line);padding:4px;text-align:center}
table.ft th{background:#f7f8f6;font-weight:600;padding:6px 4px;white-space:nowrap}
table.ft td input{padding:5px 6px;text-align:center;min-width:52px}
table.ft td.l input{text-align:left;min-width:150px}
table.ft th input.sizename{width:6.5em;min-width:52px;padding:5px 6px;text-align:center;font-weight:600;background:#fff}
table.ft td .std-cell{display:flex;align-items:center;gap:6px}
table.ft td .std-cell>span{flex:1;text-align:left;padding:5px 6px;min-width:150px}
table.ft td .std{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:6px;font-size:14px;white-space:nowrap;cursor:pointer}
table.ft td .std input{min-width:0;width:20px;height:20px;padding:0}
table.ft select{width:100%;min-width:130px;border:1px solid var(--line);border-radius:6px;padding:5px 4px;background:#fff}
.tlabel{font-weight:700;font-size:11.5px;margin:6px 0 0;color:#333}
table.ft th:first-child,table.ft td.l:first-child,table.ft tfoot td:first-child{position:sticky;left:0;z-index:1;background:#fff;box-shadow:1px 0 0 var(--line)}
table.ft th:first-child,table.ft tfoot td:first-child{background:#f7f8f6}
table.ft tfoot td{font-weight:700;background:#f7f8f6}
.tbl-actions{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pl{display:grid;gap:6px}
.pl-row{display:grid;grid-template-columns:170px 1fr 1fr 1fr;gap:8px;align-items:center}
.pl-head{display:grid;grid-template-columns:170px 1fr 1fr 1fr;gap:8px;font-size:12px;color:var(--muted);padding:0 2px}
#psearch{width:100%;max-width:420px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:2px 0 10px;background:#fff}
.pcat{margin-bottom:10px}
.pcat-t{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.picked{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.picked .sel{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:8px;padding:10px 16px}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.imgs figure{margin:0;width:150px;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;background:#fff}
.imgs img{width:100%;height:120px;object-fit:contain;background:#f7f8f6;display:block}
.imgs figcaption{font-size:12px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imgs .cap{width:100%;border:0;border-top:1px solid var(--line);font:inherit;font-size:12px;padding:4px 6px}
.imgs .btn.x{position:absolute;top:2px;right:2px;background:#fff;border-radius:6px}
.imgs .imgno{position:absolute;top:4px;left:4px;background:var(--accent);color:#fff;border-radius:6px;padding:0 6px;font-size:12px;font-weight:700}
.imgs .main-btn{width:100%;border:0;border-top:1px solid var(--line);border-radius:0;font-size:12px;padding:4px 6px;color:var(--accent);background:#f7f8f6}
.imgs .main-btn:hover{background:var(--accent-soft)}
.img-cell{display:flex;align-items:center;gap:6px}
.img-cell img{width:36px;height:36px;object-fit:contain;border:1px solid var(--line);border-radius:4px;background:#f7f8f6;flex:none}
.img-cell select{min-width:96px}

.field.missing .lab{color:var(--caution)}
.field.missing input,.field.missing .tbl-wrap,.field.missing .opts .opt{border-color:#e9c27f}
.field.missing.hard .lab{color:var(--warn)}
.field.missing.hard input,.field.missing.hard .tbl-wrap,.field.missing.hard .opts .opt{border-color:#e6a49f}
.alert{background:var(--warn-soft);border:1px solid #f0b9b4;color:var(--warn);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.alert b{display:block;margin-bottom:4px}
.after-save{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:grid;gap:10px}
.after-save .row{display:flex;flex-wrap:wrap;gap:8px}
.after-save .btn{min-height:44px}
.alert ul{margin:0;padding-left:20px}
.alert a{color:var(--warn)}
.alert.soft{background:var(--caution-soft);border-color:#f1d29c;color:var(--caution)}
.alert.soft a{color:var(--caution)}
.alert b+ul{margin-bottom:0}
.alert small{display:block;font-weight:400;margin-top:-2px;margin-bottom:4px}

#doc{display:none}
body.preview #form,body.preview .edit-only{display:none}
body.preview #doc{display:block}
body.view-only #btnPreview,body.view-only .edit-only{display:none!important}
.view-note{background:var(--caution-soft);border:1px solid var(--caution);color:var(--ink);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:grid;gap:4px}
.view-note b{color:var(--caution)}
.doc{width:210mm;min-height:297mm;margin:0 auto 24px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:10mm 10mm 14mm;font-size:12px;line-height:1.45;color:#111;font-family:"Noto Sans Thai","Sarabun",sans-serif}
table.pg{width:100%;border-collapse:collapse}
table.pg>thead>tr>td,table.pg>tbody>tr>td{padding:0;vertical-align:top}
table.pg>thead>tr>td{padding-bottom:3mm}
/* หัวกระดาษ: พิมพ์ซ้ำทุกหน้า */
.ph{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;border-bottom:2px solid var(--accent);padding-bottom:5px}
.ph .logo{height:13mm;width:auto;display:block}
.ph .tt{font-size:19px;font-weight:700;line-height:1.2;padding-left:14px;border-left:1px solid #c9cec8}
.ph .tt small{display:block;font-size:12.5px;font-weight:600;color:var(--accent);margin-top:2px}
.ph .no{text-align:right;line-height:1.3;font-size:11.5px;color:#444}
.ph .no .big{display:block;font-size:19px;font-weight:700;color:var(--accent);letter-spacing:.3px}
.ph .no .rev{color:var(--warn);font-weight:700}
.ph .job{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px 20px;background:var(--accent-soft);border-radius:5px;padding:4px 10px;font-size:11.5px;margin-top:3px}
.ph .job span{color:#555}
.ph .job b{color:#111}
.d-prod{display:flex;flex-wrap:wrap;gap:3px 18px;background:#faf6ec;border:1px solid #efe2c2;border-radius:5px;padding:5px 10px;margin:6px 0 2px;font-size:12px}
.d-prod b{color:var(--accent)}
.ds{break-inside:avoid;page-break-inside:avoid}
.page-note{display:none;max-width:210mm;margin:0 auto 8px;font-size:13px;color:var(--accent);text-align:right}
body.preview .page-note{display:block}
.page-note.warn{color:var(--warn);font-weight:600}
.doc h3{font-size:13px;margin:10px 0 4px;padding:3px 8px;background:#eef0ec;border-left:4px solid var(--accent);break-after:avoid;page-break-after:avoid}
.kv{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.kv div{display:grid;grid-template-columns:112px 1fr;gap:6px;border-bottom:1px dotted #c9cec8;padding:2.5px 2px;break-inside:avoid}
.kv div.w{grid-column:1/-1}
.kv span{color:#555}
.kv b{font-weight:600;white-space:pre-wrap}
.kv b .optimg{display:block;width:32mm;height:32mm;object-fit:cover;border-radius:2mm;margin-top:1.5mm;border:1px solid #c9cec8}
table.dt{border-collapse:collapse;width:100%;font-size:11.5px;margin:5px 0 2px;break-inside:avoid}
table.dt th,table.dt td{border:1px solid #bfc5be;padding:2.5px 5px;text-align:center}
table.dt th{background:#f1f3ef}
table.dt td.l{text-align:left}
table.dt tfoot td{font-weight:700;background:#f7f8f6}
.d-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.d-imgs figure{margin:0;border:1px solid #ccc;border-radius:4px;padding:4px;width:calc(50% - 4px);break-inside:avoid;page-break-inside:avoid}
.d-imgs img{width:100%;height:95mm;object-fit:contain;display:block;background:#fafafa}
.d-imgs.one{justify-content:center}
.d-imgs.one figure{width:auto;max-width:100%}
.d-imgs.one img{width:auto;max-width:100%;height:110mm}
.d-imgs figcaption{font-size:10.5px;color:#555;text-align:center;margin-top:2px}
.close{break-inside:avoid;page-break-inside:avoid;margin-top:12px}
.d-mockpage{break-before:page;page-break-before:always}
@media screen{.d-mockpage{margin-top:18px;padding-top:6px;border-top:2px dashed var(--line)}}
@media screen and (max-width:640px){.d-imgs img,.d-imgs.one img{height:auto}.d-imgs.one img{width:100%}}
.d-note{border:1px solid #e3d3a8;background:#fbf7ec;border-radius:5px;padding:6px 10px;font-size:11.5px}
.d-mock{color:var(--warn);text-align:center;font-weight:600;font-size:12px;margin:6px 0}
.d-accept{background:#fff3a8;border:1px solid #e6cf4f;border-radius:5px;padding:6px 10px;margin:8px 0 6px;text-align:center;color:var(--warn);font-size:11px;font-weight:600}
.d-accept b{display:block;font-size:13px}
.d-terms{margin:0;padding-left:18px;font-size:10.5px;line-height:1.45}
.d-terms+.d-note{margin-top:6px}
.sign{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
.sign.s3{grid-template-columns:repeat(3,1fr)}
.sign>div{border:1px solid #bfc5be;border-radius:5px;padding:7px;text-align:center;font-size:11.5px}
.sign .t{font-weight:700;margin-bottom:24px}
.sign .ln{border-bottom:1px dotted #777;margin:0 6px 4px;height:1px}
@media (max-width:900px){
  main.layout{grid-template-columns:minmax(0,1fr)}
  #nav{display:none}
}
@media (max-width:1100px){
  .bar h1 small{display:none}
}
@media (max-width:700px){
  .bar{position:static}
  /* แถบบนเลื่อนหายบนมือถือ · ปุ่มกลับในแอปบน iPhone ต้องอยู่บนจอเสมอ (ไม่มีปุ่มย้อนของเบราว์เซอร์) */
  .bar .back-float{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;min-height:48px;padding:10px 16px;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .bar .btn{padding:6px 10px;font-size:14px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .opts{--opt-min:140px}
  .opts.has-desc{--opt-min:100%}
  .pl-row,.pl-head{grid-template-columns:1fr}
  .pl-head{display:none}
  .doc{width:auto;min-height:0;padding:16px;margin:0 0 16px;overflow-x:auto}
  .kv{grid-template-columns:1fr}
  .ph{grid-template-columns:auto 1fr}
  .ph .no{grid-column:1/-1;text-align:left}
}
.co{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card)}
.co-hint{font-size:13px;color:var(--muted);margin:0 0 6px}
.co-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.co-tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.co-stage{position:relative;width:100%;user-select:none;-webkit-user-select:none;background:#f7f8f6;border-radius:8px;overflow:hidden}
.co-stage img{position:absolute;object-fit:contain}
.co-stage img[data-co-img]{cursor:crosshair}
.co-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.co-dot{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:transparent;border:2px solid var(--gold);padding:0;z-index:2}
button.co-dot{cursor:grab;touch-action:none}
.co-box{position:absolute;transform:translate(-50%,-50%);width:max-content;max-width:24%;background:#fff;border:1px solid var(--gold);border-radius:6px;padding:2px 6px;font-size:12px;line-height:1.35;z-index:1;box-shadow:0 1px 3px rgba(0,0,0,.15);overflow-wrap:anywhere}
div[data-co-part].co-box{cursor:move;touch-action:none}
.co-box b{color:var(--accent)}
.co-box small{display:block;color:var(--muted);font-size:11px}
.co-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.co-list li{display:grid;grid-template-columns:26px minmax(0,1.1fr) minmax(0,1.5fr) minmax(0,1.5fr) auto;gap:6px;align-items:center}
.co-list li.has-img{grid-template-columns:26px auto minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,1.4fr) auto}
.co-list li.on{background:var(--accent-soft);border-radius:8px;padding:4px}
.co-list li select[data-cf="img"]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.co-n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
@media (max-width:640px){.co-list li{grid-template-columns:26px minmax(0,1fr) auto}.co-list li select[data-cf="ref"],.co-list li input[data-cf="body"]{grid-column:2/3}.co-list li.has-img{grid-template-columns:26px auto minmax(0,1fr) auto}.co-list li.has-img input[data-cf="title"]{grid-column:3/4}.co-list li.has-img select[data-cf="ref"],.co-list li.has-img input[data-cf="body"]{grid-column:2/4}}
.d-co{margin:6px 0 0;border:1px solid #ccc;border-radius:4px;padding:4px;break-inside:avoid;page-break-inside:avoid}
.d-co .co-box{font-size:7.5pt;max-width:23%}
.d-co .co-box small{font-size:7pt}

function pajamaChart(v){
  const m=/^แขน(สั้น|ยาว)-ขา(สั้น|ยาว)$/.exec(v.style||'');
  if(!m&&/กระโปรง|สายเดี่ยว|Braless/.test(v.style||'')) return [];
  const tops=m?['แขน'+m[1]]:Object.keys(PAJAMA_TOP), bottoms=m?['ขา'+m[2]]:Object.keys(PAJAMA_BOTTOM);
  return ['FS','PS'].map(z=>`${z}: `+[...tops.map(t=>`เสื้อ${t} ${PAJAMA_TOP[t][z]}`), ...bottoms.map(b=>`กางเกง${b} ${PAJAMA_BOTTOM[b][z]}`)].join(' · ')+' นิ้ว');

function upgradeOpts(p){
  Object.values(p&&typeof p==='object'?p:{}).forEach(part=>{ if(!part||typeof part!=='object') return;
    Object.keys(part).forEach(k=>{ const x=part[k];
      if(typeof x==='string'&&RENAMED_OPTS[x]) part[k]=RENAMED_OPTS[x];
      else if(Array.isArray(x)) part[k]=x.map(y=>typeof y==='string'&&RENAMED_OPTS[y]?RENAMED_OPTS[y]:y); }); });
  return p;
}

const PRINT_PAPER='ส่งกระดาษให้ลูกค้า (ลูกค้ารีดเอง)', PRINT_ON_FABRIC='พิมพ์แล้วรีดลงผ้าของลูกค้า';
const FILM_FACTORY='โรงงานสั่งฟิล์ม', FILM_CUSTOMER='ลูกค้าส่งฟิล์มมาเอง';
const SUPPLY_UNITS=['ชิ้น','ตัว','ชุด','หลา','แผ่น','ม้วน'];
// ชิ้นส่วนที่ตัดแล้วต่างกันตามไซซ์ · คอลัมน์ไซซ์มาจากตาราง "ไซซ์และจำนวน" ของใบ เก็บเป็น sz:<ไซซ์> · จำนวนรวมคำนวณให้
const SIZE_KEY='sz:';
const suppliedSizes=r=>Object.keys(r||{}).filter(k=>k.startsWith(SIZE_KEY));
function suppliedSum(r,sizes){ const filled=sizes.filter(s=>String(r[SIZE_KEY+s]??'').trim()!==''); return filled.length?filled.reduce((a,s)=>a+num(r[SIZE_KEY+s]),0):null; }
function suppliedCols(bySize){
  const sizes=bySize?sizeCols(scope('p')):[];
  const unit={ c:'unit', label:'หน่วย', t:'select', options:SUPPLY_UNITS }, note={ c:'note', label:'สี / สภาพ / หมายเหตุ', t:'text', opt:true };
  if(!sizes.length) return [ { c:'item', label:'ของที่ส่งมา', t:'text' }, { c:'qty', label:'จำนวน', t:'number' }, unit, note ];
  // หน่วย / สี อยู่หน้าคอลัมน์ไซซ์ ไม่ให้ตกขอบขวาเมื่อไซซ์เยอะ
  return [ { c:'item', label:'ของที่ส่งมา', t:'text' }, unit, note,
    ...sizes.map(sz=>({ c:SIZE_KEY+sz, label:sz, t:'number', opt:true })), { c:'qty', label:'รวม', t:'number', auto:true } ];
}
const SUPPLY = (x={}) => {
  const any=v=>!x.none||rows(v,'supplied',true).length>0;

function sizePairs(v){
  const sets=v.size_sets||[], base=sets.flatMap(n=>SIZESETS[n]||[]);

  const names=namesSizes(v)&&v.size_names&&typeof v.size_names==='object'?v.size_names:{}, seen=new Set();

function keepSizeQty(v,change){
  const before=new Map(sizePairs(v)); change(); const after=new Map(sizePairs(v));
  const moves=[...before].filter(([b,f])=>after.has(b)&&after.get(b)!==f).map(([b,f])=>[f,after.get(b)]);
  if(!moves.length) return;
  (Array.isArray(v.sizes)?v.sizes:[]).forEach(r=>{ const old=r.q||{}, q={...old};
    moves.forEach(([from])=>delete q[from]); moves.forEach(([from,to])=>{ if(old[from]!==undefined) q[to]=old[from]; }); r.q=q; });
  (Array.isArray(v.measure_rows)?v.measure_rows:[]).forEach(r=>{ const m=moves.find(([from])=>String(r.size||'').trim()===from); if(m) r.size=m[1]; });

function rows(v,id,opt){ if(!Array.isArray(v[id])||(!opt&&!v[id].length)) v[id]=opt?[]:[{q:{}}]; return v[id]; }

// ยอดรวม: ตารางไซซ์ → ตารางรายการ (คอลัมน์ sum) → ช่องจำนวน
function totalQty(){
  const v=scope('p');
  for(const f of allFields()){
    if(!visible(f,v)) continue;
    if(f.type==='sizeTable'){ const cols=sizeCols(v); return rows(v,f.id).reduce((a,r)=>a+cols.reduce((b,c)=>b+num(r.q[c]),0),0); }
    if(f.type==='itemTable'){ const c=f.cols.find(c=>c.sum); if(c) return rows(v,f.id).reduce((a,r)=>a+num(r[c.c]),0); }
    if(f.id==='qty') return num(v.qty);
  }
  return 0;
}
const MAX_QTY=100000;
// ช่องจำนวนชิ้น (ตารางไซซ์ / ตารางรายการ / จำนวน / ผลิตเผื่อเสีย) ที่กรอกแล้ว · ระบบรับงานเป็นจำนวนเต็มเท่านั้น
function pieceFields(){
  const v=scope('p'), out=[], filled=x=>x!==''&&x!=null;
  for(const sec of layout().filter(x=>x.s==='p'&&x.fields)) for(const f of sec.fields){
    if(!visible(f,v)||(naAllowed(f)&&isNA(f,v))) continue;
    let values=null;
    if(f.type==='sizeTable'){ const cols=sizeCols(v); values=rows(v,f.id).flatMap(r=>cols.map(c=>r.q[c]).filter(filled)); }
    else if(f.type==='itemTable'){ const c=f.cols.find(c=>c.sum); if(c) values=rows(v,f.id).map(r=>r[c.c]).filter(filled); }
    else if(f.id==='qty'||f.id==='spare') values=filled(v[f.id])?[v[f.id]]:[];
    if(values) out.push({ sec, f, values:values.map(num) });
  }
  return out;
}
// เส้นทางผลิตคิดจากเทคนิคที่เลือก (สินค้าที่ไม่ใช่งานผ้ากำหนดเส้นทางเองใน route)

function shiftImgRefs(removed){
  const v=scope('p');
  allFields().filter(f=>f.type==='itemTable'||f.type==='sizeTable').forEach(f=>{ (Array.isArray(v[f.id])?v[f.id]:[]).forEach(r=>{

function moveImgToFirst(idx){
  if(idx<=0||idx>=state.imgs.length) return;
  const [picked]=state.imgs.splice(idx,1); state.imgs.unshift(picked);
  if(Array.isArray(state.co_sizes)&&state.co_sizes.length>idx){
    const [sz]=state.co_sizes.splice(idx,1); state.co_sizes.unshift(sz);
  }
  state.co_size=(Array.isArray(state.co_sizes)&&state.co_sizes[0])||(picked?.w>0&&picked?.h>0?{w:picked.w,h:picked.h}:state.co_size);
  coList().forEach(c=>{ const raw=Number(c&&c.img), n=Number.isInteger(raw)&&raw>=0?raw:0; if(n===idx) c.img=0; else if(n>=0&&n<idx) c.img=n+1; });
  const v=scope('p');
  allFields().filter(f=>f.type==='itemTable'||f.type==='sizeTable').forEach(f=>{ (Array.isArray(v[f.id])?v[f.id]:[]).forEach(r=>{
    const n=+r.img||0; if(n===idx+1) r.img='1'; else if(n>=1&&n<=idx) r.img=String(n+1); }); });
  if(typeof coTab!=='undefined') coTab=0;

}

  p.classList.toggle('done',!m.length); p.classList.toggle('soft',!hard&&m.length>0);

// ย่อภาพให้ด้านยาวไม่เกิน 1600px เพื่อให้ PDF และไฟล์งานไม่ใหญ่เกินไป
function compress(file){ return new Promise(res=>{ const fr=new FileReader();
  fr.onload=()=>{ const img=new Image();
    img.onload=()=>{ const k=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); const g=c.getContext('2d');
      g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      res({ name:file.name, src:c.toDataURL('image/jpeg',0.85), w:c.width, h:c.height }); };
    img.onerror=()=>res(null); img.src=fr.result; };
  fr.onerror=()=>res(null); fr.readAsDataURL(file); }); }
let readingImgs=0;
function rerender(){ const y=scrollY; renderForm(); scrollTo(0,y); save(); refreshThumb(); }
// รูปที่มาจากระบบเป็นลิงก์ข้ามเว็บ ย่อไม่ได้ · ส่งแค่ path เดิม ระบบใช้ไฟล์เดิม
const sysPath=(m,i)=>/^data:/.test(m.src||'')?'':m.path||(i===0?state.mockup_path||'':'');
// ทุกรูปย่อด้านยาว 1000px (~150 KB) เพราะส่งเข้าระบบผ่าน localStorage ที่พื้นที่น้อย · ค่า null = ย่อไม่ได้
const shrunk=new Map();
const measured=new Map();
function syncCoSizes(){
  const next=state.imgs.map((m,i)=>{
    const cur=Array.isArray(state.co_sizes)?state.co_sizes[i]:null;
    const hit=m?.src?measured.get(m.src):null;
    if(hit&&hit.w>0&&hit.h>0) return hit;
    if(m&&m.w>0&&m.h>0) return { w:m.w, h:m.h };
    if(cur&&cur.w>0&&cur.h>0) return cur;
    return null;
  });
  state.co_sizes=next;
  if(next[0]) state.co_size=next[0];
  else if(!state.imgs.length) state.co_size=null;
}
function refreshThumb(){
  syncCoSizes();
  state.imgs.forEach((m,i)=>{
    const src=m&&m.src;
    if(!src) return;
    if(m.w>0&&m.h>0&&!measured.has(src)) measured.set(src,{ w:m.w, h:m.h });
    if(!measured.has(src)){
      measured.set(src,null);
      const img=new Image();
      img.onload=()=>{
        const sz={ w:img.width, h:img.height };
        if(!(sz.w>0&&sz.h>0)) return;
        measured.set(src,sz);
        if(state.imgs[i]?.src!==src) return;
        const prev=Array.isArray(state.co_sizes)&&state.co_sizes[i];
        if(prev&&prev.w===sz.w&&prev.h===sz.h&&(i!==0||(state.co_size?.w===sz.w&&state.co_size?.h===sz.h))) return;
        if(!Array.isArray(state.co_sizes)) state.co_sizes=[];
        state.co_sizes[i]=sz;
        if(i===0) state.co_size=sz;
        const st=form.querySelector('[data-co-stage]');
        if(st&&coActiveImg()===i) st.outerHTML=coStageHTML(true,i);
        save();
      };
      img.src=src;
    }
    if(sysPath(m,i)||shrunk.has(src)) return;
    shrunk.set(src,undefined); const img=new Image();
    img.onload=()=>{ const k=Math.min(1,1000/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); const g=c.getContext('2d');
      g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      let data=null; try{ data=c.toDataURL('image/jpeg',0.8); }catch(e){}
      shrunk.set(src,data); };
    img.onerror=()=>shrunk.set(src,null);
    img.src=src; });
}

const OUTBOX='pp142.confirmation.outbox', INBOX='pp142.confirmation.inbox';

const RELINK_REQ='pp142.confirmation.relink', RELINK_RES='pp142.confirmation.relinked';
const linkExp=src=>{ try{ if(!/^https?:/i.test(src||'')) return null; const e=Number(new URL(src).searchParams.get('exp')); return e>0?e*1000:null; }catch(e){ return null; } };
// รูปจากระบบที่ไม่มีลิงก์เลย (ขอลิงก์ไม่สำเร็จตอนเปิด) ถือว่าหมดอายุ ไม่อย่างนั้นส่งออก PDF แล้วรูปหายเงียบๆ
const staleLinks=ms=>state.imgs.map((m,i)=>({ no:i+1, path:sysPath(m,i), src:m.src||'', exp:linkExp(m.src) }))
  .filter(x=>x.path&&(x.exp===null?!/^(https?|blob):/i.test(x.src):x.exp<Date.now()+ms));
let relinkWait=null, lastRelink='';
function requestRelink(list){
  const id=Date.now()+'-'+Math.random().toString(36).slice(2);
  lastRelink=id;
  try{ localStorage.setItem(RELINK_REQ, JSON.stringify({ id, paths:[...new Set(list.map(x=>x.path))] })); }catch(e){ return Promise.resolve(false); }
  return new Promise(res=>{ relinkWait={ id, res }; setTimeout(()=>{ if(relinkWait?.id===id){ relinkWait=null; res(false); } }, 8000); });
}
// เปลี่ยนแค่ลิงก์ของรูปที่แสดงอยู่ · ไม่วาดฟอร์มใหม่ (ช่องที่กำลังพิมพ์ไม่หลุด) · คำตอบที่มาช้ากว่าที่รอยังใช้ได้
function applyRelink(raw){
  let r=null; try{ r=JSON.parse(raw); }catch(e){}
  if(!r||r.id!==lastRelink||!r.urls||typeof r.urls!=='object') return;
  let n=0;
  state.imgs.forEach((m,i)=>{
    const p=sysPath(m,i), u=p&&r.urls[p];
    if(typeof u!=='string'||!/^https?:/i.test(u)) return;
    const old=m.src; m.src=u; n++;
    if(old) document.querySelectorAll('img').forEach(el=>{ if(el.getAttribute('src')===old) el.setAttribute('src',u); });
  });
  if(relinkWait?.id===r.id){ const w=relinkWait; relinkWait=null; w.res(n>0); }
}

function systemCopy(){
  const shown=scope('p'), part={...shown};
  const drop=(obj,f)=>{ delete obj[f.id]; delete obj[f.id+'__other']; delete obj[f.id+'__unit']; delete obj[f.id+'__na']; (f.parts||[]).forEach((_,i)=>delete obj[f.id+'_'+i]); if(f.id==='size_sets') delete obj.size_names; };
  // ช่อง id เดียวกันมีหลายแบบ (ขนาดสำเร็จ เสื้อ / กางเกง / ชุด) · ลบเฉพาะ id ที่ไม่มีแบบไหนแสดงอยู่เลย
  const keep=new Set(allFields().filter(f=>visible(f,shown)&&!(naAllowed(f)&&isNA(f,shown))).map(f=>f.id));
  allFields().forEach(f=>{ if(!keep.has(f.id)) drop(part,f); });
  if(!namesSizes(part)) delete part.size_names;
  else if(part.size_names) part.size_names=Object.fromEntries(sizePairs(part).filter(([b,f])=>b!==f));
  if(Array.isArray(part.supplied)){ const cols=sizeCols(part);
    part.supplied=part.supplied.map(r=>{ const out=Object.fromEntries(Object.entries(r).filter(([k])=>!k.startsWith(SIZE_KEY)||cols.includes(k.slice(SIZE_KEY.length))));
      const sum=suppliedSum(out,cols); if(sum!==null) out.qty=String(sum); return out; }); }
  if(Array.isArray(part.sizes)){ const cols=new Set(sizeCols(part));
    part.sizes=part.sizes.map(r=>({ ...r, q:Object.fromEntries(Object.entries(r.q||{}).filter(([k])=>cols.has(k))) })); }
  const head={...state.h};
  HEADER.flatMap(sec=>sec.fields).forEach(f=>{ if(!visible(f,head)||(naAllowed(f)&&isNA(f,head))) drop(head,f); });
  // หน้าระบบรับงานเย็บอย่างเดียวด้วยรหัสสินค้าเสื้อผ้า (สูตรจักร) · ฐานข้อมูลเทียบรหัสนี้กับงาน

  return { h:head, p:{ [state.product]:part } };
}

  }
  // รูปที่เพิ่งเลือกยังอ่าน/ย่อไม่เสร็จ = ไม่ส่ง ไม่อย่างนั้นใบไปถึงระบบโดยไม่มีรูป · ใบแก้ที่ใช้รูปเดิมของงานไม่ต้องรอ
  refreshThumb();
  if(readingImgs||state.imgs.some((m,i)=>!sysPath(m,i)&&shrunk.get(m.src)===undefined)){ alert('กำลังเตรียมรูปม็อคอัพ รอ 1–2 วินาที แล้วกด "'+btn+'" อีกครั้ง'); return; }
  const broken=state.imgs.map((m,i)=>!sysPath(m,i)&&!shrunk.get(m.src)?i+1:0).filter(Boolean);
  if(broken.length){ alert('เปิดรูปที่ '+broken.join(', ')+' ไม่ได้ ลบรูปนั้นแล้วเลือกไฟล์รูปใหม่'); return; }
  // รูปของใบเลขอื่นส่งไปกับใบเลขใหม่ไม่ได้ · ถ้าตัดทิ้งเงียบๆ เลขรูปของแต่ละแบบและจุดกำกับจะชี้ผิดรูป
  const foreign=String(state.mockup_no||'')!==String(state.h.doc_no||'').trim()?state.imgs.map((m,i)=>sysPath(m,i)?i+1:0).filter(Boolean):[];

  const payload={ app:'phappim-confirm', v:1, ...state, imgs:[], summary:{ qty:totalQty() }, ...systemCopy() };
  payload.mockups=state.imgs.map((m,i)=>{ const path=sysPath(m,i); return path?{ name:m.name||'', path }:{ name:m.name||'', data:shrunk.get(m.src) }; });

  // ฟอร์มจำรูปเต็มขนาดไว้ในพื้นที่เดียวกัน · เต็มแล้วเก็บสำเนาฟอร์มแบบไม่มีรูปก่อน แล้วลองส่งอีกครั้ง
  const outbox=JSON.stringify(payload);

  const url='/#/board?confirmation=save';
  if(IN_APP){ location.href=url; return; }
  const w=window.open(url,'pp142-system');

// ใบที่บันทึกเข้าระบบแล้วจำลายเซ็นไว้ · เปิดใบใหม่ทับได้เลย ไม่ต้องเก็บแยก
// รูปจากระบบเทียบด้วย path (ลิงก์เปลี่ยนทุกครั้งที่ขอใหม่ ไม่ได้แปลว่าใบเปลี่ยน)
const formSig = s => hashText(JSON.stringify([s.h, s.p, s.product, s.callouts, (s.imgs||[]).map(m=>m.path||m.src||'')]));
function hashText(t){ let a=0x811c9dc5, b=0x01000193; for(let i=0;i<t.length;i++){ const c=t.charCodeAt(i); a=Math.imul(a^c,0x01000193)>>>0; b=Math.imul(b^c,0x5bd1e995)>>>0; } return a.toString(36)+'.'+b.toString(36)+'.'+t.length; }
// ปุ่ม "เปิดฟอร์มใบยืนยัน (ใบใหม่)" ส่ง ?new มา · ใบที่กรอกค้างในเครื่องเก็บแยกไว้เปิดคืนได้ ไม่ทิ้งเงียบๆ

const hasWork = s => Object.entries(s.h||{}).some(([k,v])=>k!=='issue_date'&&String(v??'').trim()) || (s.imgs||[]).length>0;
// แอปบน iPad/iPhone ออกจากฟอร์มทันทีหลังบันทึก จึงไม่เห็นปุ่มทำสินค้าถัดไป · หน้าระบบส่ง ?next กลับมาแทน
function takeNext(){

function takeNew(){

  state=fresh(); coTab=0; missing=[]; rerender(); scrollTo(0,0);

    <div class="row"><button class="btn" data-act="restoreprev">เปิดใบที่กรอกค้างกลับมา</button><button class="btn" data-act="dropprev">ไม่ใช้ใบเดิมแล้ว</button></div></div>`;
}
function restorePrev(){

  if(hasWork(state)&&!confirm('ข้อมูลที่กรอกในใบใหม่จะถูกแทนที่ด้วยใบที่กรอกค้างไว้ ดำเนินการต่อ?')) return;

// หน้าระบบกด "เปิดในฟอร์ม" (แก้ใบที่บันทึกไว้) → ใส่ข้อมูลไว้ใน INBOX แล้วเปิดหน้านี้

// กด Enter = ไปช่องถัดไป (กรอกตารางไซซ์ได้เร็ว) · กันล้อเมาส์เปลี่ยนตัวเลขโดยไม่ตั้งใจ
form.addEventListener('keydown',e=>{ const t=e.target;

const SIZE_KEYS=new Set(['size','chest','length','sleeve','waist','hip','leg','w','h','qty']);
// "28-34" เป็นช่วง ไม่ใช่ติดลบ · ติดลบ = ขึ้นต้นด้วยลบ หรือลบหลังเครื่องหมายคูณ
const negative = x => /^[-−]\s*\d|[×x*]\s*[-−]\s*\d/i.test(String(x??'').trim());
function negativeIn(f,v){
  const val=v[f.id];
  switch(f.type){
    case 'number': return negative(val);
    case 'dims': return f.parts.some((p,i)=>negative(v[f.id+'_'+i]));
    case 'sizeTable': return rows(v,f.id).some(r=>Object.values(r.q||{}).some(negative));
    case 'itemTable': return rows(v,f.id,!!f.none).some(r=>f.cols.some(c=>(c.t==='number'||SIZE_KEYS.has(c.c))&&negative(r[c.c])));
    case 'placements': return Object.values(val||{}).some(x=>x.on&&negative(x.size));
  }
  return false;
}
function fieldIssue(f,v){
    const val=v[f.id]; let bad=false, why='';
    switch(f.type){
      case 'text': case 'date': case 'textarea': bad=f.req&&!String(val??'').trim(); break;
      case 'number': bad=f.req&&!(num(val)>0); break;
      case 'radio': bad=(f.req&&!val)||(val===OTHER&&!String(v[f.id+'__other']??'').trim()); if(bad&&val===OTHER) why='ระบุรายละเอียด "อื่นๆ"'; break;
      case 'check': bad=(f.req&&!(val||[]).length)||((val||[]).includes(OTHER)&&!String(v[f.id+'__other']??'').trim()&&!(f.id==='size_sets'&&sizePairs(v).some(([b,n])=>b!==n)));
        if(bad&&f.id==='size_sets'&&(val||[]).includes(OTHER)) why='พิมพ์ไซซ์เพิ่มในช่อง "อื่นๆ" หรือแก้ชื่อไซซ์ที่หัวตารางจำนวน'; break;
      case 'dims': bad=f.req&&f.parts.some((p,i)=>i<2&&!(num(v[f.id+'_'+i])>0)); break;
      case 'sizeTable': { const cols=sizeCols(v), rs=rows(v,f.id);
        const tot=r=>cols.reduce((a,c)=>a+num(r.q[c]),0);
        if(!rs.some(r=>tot(r)>0)){ bad=true; why='ยังไม่มีจำนวน'; }
        else if(rs.some(r=>tot(r)>0&&!String(r.label??'').trim())){ bad=true; why='ใส่ชื่อแบบ/สีให้ทุกแถวที่มีจำนวน'; }
        break; }
      case 'itemTable': { const rs=rows(v,f.id,!!f.none);
        const full=f.id==='measure_rows'
          ? r=>String(r.size??'').trim()&&f.cols.some(c=>c.c!=='size'&&String(r[c.c]??'').trim())
          : r=>f.cols.filter(c=>!c.opt).every(c=>c.t==='number'?num(r[c.c])>0:String(r[c.c]??'').trim());
        const empty=r=>f.cols.every(c=>!String(r[c.c]??'').trim());
        if(f.req&&!rs.some(full)){ bad=true; why=f.id==='measure_rows'?'ใส่ไซซ์และขนาดอย่างน้อย 1 แถว':'ต้องมีอย่างน้อย 1 รายการที่กรอกครบ'; }
        else if(rs.some(r=>!full(r)&&!empty(r))){ bad=true; why='มีแถวที่กรอกไม่ครบ'; }
        break; }
      case 'placements': { const on=Object.entries(val||{}).filter(([,x])=>x.on);
        if(!on.length){ bad=true; why='ติ๊กอย่างน้อย 1 ตำแหน่ง'; }
        else if(on.some(([,x])=>!String(x.size??'').trim())){ bad=true; why='ใส่ขนาดให้ทุกตำแหน่งที่ติ๊ก'; }
        else if([].concat(v.print_method||[]).filter(m=>!/ไม่มีลาย/.test(m)).length>1&&on.some(([,x])=>!String(x.tech??'').trim())){ bad=true; why='เลือกไว้หลายเทคนิค ต้องระบุเทคนิคของแต่ละตำแหน่ง'; }
        break; }
      case 'images': bad=f.req&&!state.imgs.length; break;
    }
    return { bad, why };
}
function validate(){
  const out=[];
  layout().filter(sec=>sec.fields).forEach(sec=>{ const s=sec.s, v=scope(s); sec.fields.forEach(f=>{
    if(!visible(f,v)||(naAllowed(f)&&isNA(f,v))) return;
    const { bad, why }=fieldIssue(f,v);
    if(negativeIn(f,v)){ out.push({ id:`fld_${s}_${f.id}`, sec:sec.no, label:`${sec.title} › ${f.label}`, why:'มีขนาดหรือจำนวนติดลบ แก้เป็นค่าบวก', hard:true }); return; }
    if(bad) out.push({ id:`fld_${s}_${f.id}`, sec:sec.no, label:`${sec.title} › ${f.label}`, why, hard:s==='h'&&MUST_FILL.includes(f.id) });
  }); });
  pieceFields().forEach(({ sec, f, values })=>{
    const where={ id:`fld_p_${f.id}`, sec:sec.no, label:`${sec.title} › ${f.label}`, hard:true };
    if(values.some(x=>!Number.isInteger(x))) out.push({ ...where, why:'จำนวนชิ้นต้องเป็นจำนวนเต็ม (ไม่มีทศนิยม)' });
    else if(f.id!=='spare'&&totalQty()>MAX_QTY) out.push({ ...where, why:`รวม ${totalQty().toLocaleString()} มากเกินไป ตรวจว่าพิมพ์ตัวเลขถูกไหม (ไม่เกิน ${MAX_QTY.toLocaleString()})` });
    else if(f.id==='spare'&&values.some(x=>x>MAX_QTY)) out.push({ ...where, why:`มากเกินไป ตรวจว่าพิมพ์ตัวเลขถูกไหม (ไม่เกิน ${MAX_QTY.toLocaleString()})` });
  });
  { const rev=state.h.rev; if(rev!==''&&rev!=null&&!(Number.isInteger(+rev)&&+rev>=0&&+rev<1000)) out.push({ id:'fld_h_rev', sec:2, label:'ข้อมูลใบงาน › แก้ไขครั้งที่', why:'ใส่เป็นเลขจำนวนเต็ม 1, 2, 3 …', hard:true }); }
  // ช่องวันที่เก็บปี ค.ศ. · พิมพ์ปี พ.ศ. ลงไปได้ (2569) แล้ว PDF จะพิมพ์เป็น 3112 และระบบไม่รับ
  [['issue_date','วันที่ออกใบ'],['sample_date','วันนัดส่งตัวอย่าง'],['due_date','กำหนดส่งงาน']].forEach(([id,label])=>{
    const y=+String(state.h[id]||'').split('-')[0];
    if(y&&(y<2000||y>2399)&&(id!=='sample_date'||sampleDateShown(state.h))) out.push({id:`fld_h_${id}`,sec:2,label:`ข้อมูลใบงาน › ${label}`,why:'ปีไม่ถูกต้อง · ระบบใช้ปี ค.ศ. (พ.ศ. 2569 = ค.ศ. 2026) เลือกวันจากปฏิทินใหม่',hard:true});
  });
  if(state.h.issue_date&&state.h.due_date&&state.h.due_date<state.h.issue_date) out.push({id:'fld_h_due_date',sec:2,label:'ข้อมูลใบงาน › กำหนดส่งงาน',why:'อยู่ก่อนวันที่ออกใบ',hard:true});
  { const v=scope('p'), sec=layout().find(x=>x.s==='p'&&x.fields?.some(f=>f.id==='collar'&&f.options.includes('ไม่มีปก')));
    if(sec&&wantsCollar(v)&&(!v.collar||v.collar==='ไม่มีปก')) out.push({ id:'fld_p_collar', sec:sec.no, label:`${sec.title} › ปก`, why:'เลือกคอปก / เสื้อโปโลไว้ ให้เลือกชนิดปก' }); }
  if(sampleDateShown(state.h)&&state.h.sample_date&&state.h.due_date&&state.h.sample_date>state.h.due_date) out.push({id:'fld_h_sample_date',sec:2,label:'ข้อมูลใบงาน › วันนัดส่งตัวอย่าง',why:'อยู่หลังกำหนดส่งงาน',hard:true});
  return out;
}
function markMissing(){ missing.forEach(m=>{ const el=document.getElementById(m.id); el?.classList.add('missing'); if(m.hard) el?.classList.add('hard'); }); }
function showAlert(){
  const li=list=>`<ul>${list.map(m=>`<li><a href="#${m.id}" data-goto="${m.id}">${esc(m.label)}</a>${m.why?` — ${esc(m.why)}`:''}</li>`).join('')}</ul>`;
  const hard=missing.filter(m=>m.hard), soft=missing.filter(m=>!m.hard);
  $('#alert').innerHTML=(hard.length?`<div class="alert"><b>ต้องแก้ ${hard.length} รายการก่อนส่งออก PDF</b>${li(hard)}</div>`:'')+
    (soft.length?`<div class="alert soft"><b>ยังไม่ได้กรอก ${soft.length} รายการ</b><small>ไม่บังคับ · ช่องที่งานนี้ไม่ใช้ กด "ไม่ใช้กับงานนี้" ที่ช่องนั้น หรือส่งออก PDF ได้เลย</small>${li(soft)}</div>`:'');

$('#alert').addEventListener('click',e=>{ const a=e.target.closest('[data-goto]'); if(!a) return; e.preventDefault();

function thDate(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return `${+d}/${+m}/${+y+543}`; }
// ค่าที่แปลว่า "ไม่มี / ไม่ต้องทำ" ไม่พิมพ์ลง PDF เพื่อไม่ให้ฝ่ายผลิตสับสน
const isNone = s => { const t=String(s??'').trim(); return !t || /^(-|—|ไม่มี|ไม่ต้อง)$/.test(t) || /^ไม่มี\s*\(/.test(t) || (/^ไม่มี/.test(t) && !/\(/.test(t)); };
function valText(f,v){
  const val=v[f.id], o=x=>x===OTHER?`${OTHER}: ${v[f.id+'__other']||''}`:x;
  switch(f.type){
    case 'date': return val?thDate(val):'';
    case 'number': { const u=unitOf(f,v); return num(val)>0?`${val}${u?' '+u:''}`:''; }
    case 'radio': return val&&!isNone(val)?o(val):'';
    case 'check': return (val||[]).filter(x=>!isNone(x)).map(o).join(', ');
    case 'dims': {
      // ช่องที่ใส่หน่วยในวงเล็บเอง เช่น "หนา (นิ้ว)" แสดงหน่วยของตัวเองแยกจากหน่วยหลัก
      const ps=f.parts.map((p,i)=>{ const m=/^(.*?)\s*\(([^)]+)\)$/.exec(p); return { name:m?m[1]:p, unit:m?m[2]:'', x:v[f.id+'_'+i] }; }).filter(p=>num(p.x)>0);
      const main=ps.filter(p=>!p.unit), own=ps.filter(p=>p.unit);
      return [main.length?main.map(p=>`${p.name} ${p.x}`).join(' × ')+' '+unitOf(f,v):'', ...own.map(p=>`${p.name} ${p.x} ${p.unit}`)].filter(Boolean).join(' · '); }
    default: { const t=String(val??'').trim(); return isNone(t)?'':t; }
  }
}
function kvHTML(fs,v){
  const items=fs.map(f=>{ const t=valText(f,v), pic=f.type==='radio'&&OPT_IMG[v[f.id]]; return t?`<div class="${f.type==='textarea'||t.length>40||pic?'w':''}"><span>${esc(f.label.replace(/ \(.*\)$/,''))}</span><b>${esc(t)}${pic?`<img class="optimg" src="${pic}" alt="">`:''}</b></div>`:''; }).join('');
  return items?`<div class="kv">${items}</div>`:'';
}
function renderDoc(){
  const h=state.h, v=scope('p'), P=prod(), forCustomer=customerCopy();
  const qty=`${totalQty().toLocaleString()} ${P.unit}`;

  const head=`<div class="ph">
    <img class="logo" src="${COMPANY.logo}" alt="${esc(COMPANY.name)}">
    <div class="tt">ใบยืนยันการผลิต<small>${esc(P.name)}${forCustomer?'':' · ฉบับโรงงาน'}</small></div>
    <div class="no"><span class="big">${esc(h.doc_no||'—')}</span>${num(h.rev)>0?`<span class="rev">แก้ไขครั้งที่ ${esc(h.rev)}</span>`:''}</div>
    <div class="job"><span>ลูกค้า <b>${esc(h.customer||'—')}</b></span><span>งาน <b>${esc(h.job_name||'—')}</b></span><span>จำนวน <b>${qty}</b></span></div>
  </div>`;

  const hk=(label,val,w)=>isNone(val)?'':`<div${w?' class="w"':''}><span>${label}</span><b>${esc(val)}</b></div>`;

  const address=needsAddress(h.delivery)?hk('ที่อยู่จัดส่ง',hv('address'),true):'';
  const hItems=forCustomer?[hk('วันที่สั่งงาน',h.issue_date?thDate(h.issue_date):''), hk('ผู้ประสานงาน',coordinator), hk('การจัดส่ง',h.delivery), address].join(''):[hk('ผู้ติดต่อ',hv('contact')), hk('เบอร์โทร',hv('phone')),
    hk('วันที่ออกใบ',h.issue_date?thDate(h.issue_date):''), hk('วันนัดส่งตัวอย่าง',sampleDateShown(h)&&h.sample_date?thDate(h.sample_date):''),
    hk('การรับสินค้า',h.delivery), hk('แอดมินผู้ดูแล',coordinator), address].join('');
  let x=`<section class="ds">${hItems?`<div class="kv">${hItems}</div>`:''}
  <div class="d-prod"><span>จำนวนรวม <b>${qty}</b>${!forCustomer&&num(v.spare)>0?` (+ เผื่อเสีย ${esc(v.spare)} ${P.unit})`:''}</span></div></section>`;

  let n=0, mockup='';
  allSecs().forEach(sec=>{
    const fs=sec.fields.filter(f=>visible(f,v)&&!(naAllowed(f)&&isNA(f,v))&&(!forCustomer||customerSees(f,sec)));
    const simple=fs.filter(f=>!['sizeTable','itemTable','placements','images'].includes(f.type)&&f.id!=='spare');
    let body=kvHTML(simple,v);
    fs.forEach(f=>{
      if(f.type==='sizeTable'){
        const all=sizeCols(v), rs=rows(v,f.id).filter(r=>all.some(c=>num(r.q[c])>0));
        const cols=all.filter(c=>rs.some(r=>num(r.q[c])>0));
        const pic=rs.some(r=>imgName(+r.img));
        if(rs.length) body+=`<table class="dt"><thead><tr><th>${esc(f.rowLabel||'แบบ / สี')}</th>${pic?'<th>รูป</th>':''}${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>รวม</th></tr></thead><tbody>`+
          rs.map(r=>`<tr><td class="l">${esc(r.label)}</td>${pic?`<td>${imgName(+r.img)?'รูป '+(+r.img):''}</td>`:''}${cols.map(c=>`<td>${num(r.q[c])||''}</td>`).join('')}<td><b>${cols.reduce((a,c)=>a+num(r.q[c]),0)}</b></td></tr>`).join('')+

        const chart=sizeChart(f,v); if(rs.length&&chart.length) body+=`<div class="tlabel">ขนาดสำเร็จ</div>`+chart.map(l=>`<p>${esc(l)}</p>`).join('');

      if(f.type==='itemTable'){
        const own=forCustomer?f.cols.filter(c=>!c.factory&&!c.lead):f.cols;
        const rs=rows(v,f.id,!!f.none).filter(r=>own.some(c=>!isNone(r[c.c])));
        const lab=f.none||f.printLabel?`<div class="tlabel">${esc(fieldLabel(f,v))}</div>`:'';
        // ไม่มีรายการ = ไม่พิมพ์หัวข้อนี้ · คอลัมน์ที่ว่างทุกแถวไม่แสดง ยกเว้นยอดรวม
        const cell=(c,r)=>c.t==='img'?(imgName(+r[c.c])?'รูป '+(+r[c.c]):''):isNone(r[c.c])?'':r[c.c];
        const cols=f.cols.filter(c=>!(forCustomer&&c.factory)&&(c.sum||rs.some(r=>cell(c,r))));
        if(rs.length) body+=lab+`<table class="dt"><thead><tr><th>#</th>${cols.map(c=>`<th>${esc(colLabel(c,f,v))}</th>`).join('')}</tr></thead><tbody>`+
          rs.map((r,i)=>`<tr><td>${i+1}</td>${cols.map(c=>`<td class="${c.t!=='number'&&c.t!=='img'?'l':''}">${esc(cell(c,r))}</td>`).join('')}</tr>`).join('')+
          `</tbody>${cols.some(c=>c.sum)?`<tfoot><tr><td colspan="${cols.length}">รวม</td><td>${totalQty()}</td></tr></tfoot>`:''}</table>`;
      }
      if(f.type==='placements'){
        const on=Object.entries(v[f.id]||{}).filter(([,p])=>p.on);
        const ms=[].concat(v.print_method||[]).filter(m=>!/ไม่มีลาย/.test(m));
        if(on.length) body+=`<table class="dt"><thead><tr><th>ตำแหน่ง</th><th>เทคนิค</th><th>ขนาด (${unitOf(f,v)})</th><th>หมายเหตุ</th></tr></thead><tbody>`+
          on.map(([k,p])=>`<tr><td class="l">${esc(k)}</td><td class="l">${esc(p.tech||(ms.length===1?ms[0]:''))}</td><td>${esc(p.size)}</td><td class="l">${esc(p.note)}</td></tr>`).join('')+`</tbody></table>`;
      }
      if(f.type==='images'&&state.imgs.length){
        const co=coDocHTML();
        const plain=state.imgs.map((m,i)=>({m,i})).filter(({i})=>!co||!coList().some(c=>coImgAt(c)===i));
        mockup=co+(plain.length?`<div class="d-imgs${plain.length===1?' one':''}">${plain.map(({m,i})=>`<figure><img src="${m.src}" alt=""><figcaption>${esc(imgName(i+1))}</figcaption></figure>`).join('')}</div>`:'');
      }
    });
    if(body) x+=`<section class="ds"><h3>${++n}. ${esc(sec.title)}</h3>${body}</section>`;
  });

  if(mockup) x+=`<section class="d-mockpage"><h3>ภาพม็อคอัพ (Mock up)</h3>${mockup}${mockup.includes('class="d-co"')?'':`<div class="d-mock">${esc(MOCKUP_NOTE)}</div>`}</section>`;
  const sig=t=>`<div><div class="t">${t}</div><div class="ln"></div>(.......................................)<br>วันที่ ....../....../......</div>`;
  x+=`<div class="close">${mockup?'':`<div class="d-mock">${esc(MOCKUP_NOTE)}</div>`}
    <div class="d-accept"><b>${esc(ACCEPT_TITLE)}</b>${esc(ACCEPT_TEXT)}</div>
    <ol class="d-terms">${[...TERMS,...(P.cat==='service'?TERMS_SERVICE:[])].map(t=>`<li>${esc(t)}</li>`).join('')}</ol>
    <div class="d-note"><b>ข้อตกลง:</b> ลูกค้าตรวจสอบรายละเอียดทั้งหมดในใบนี้แล้ว ${state.h.sample===SAMPLE_YES?'ฝ่ายผลิตจะผลิตตัวอย่าง 1 ชิ้นให้ลูกค้ายืนยันก่อนผลิตจริง':state.h.sample===SAMPLE_DEV?'งานนี้เป็นงาน Develop ฝ่ายผลิตทำตัวอย่างให้ลูกค้ายืนยัน งานจบที่ตัวอย่าง ไม่ผลิตจริง (ผลิตจริงต้องทำใบยืนยันใหม่)':'งานนี้ไม่ขึ้นตัวอย่าง ฝ่ายผลิตผลิตจริงตามใบนี้'}
    และผลิตตามรายละเอียดในใบนี้เท่านั้น <b>รายการที่ไม่ได้ระบุในใบนี้ถือว่าไม่มี / ไม่ต้องทำ</b> การแก้ไขหลังเซ็นต้องออกใบยืนยันฉบับใหม่ และอาจมีผลต่อกำหนดส่ง</div>

// ประมาณจำนวนหน้า A4 (พื้นที่พิมพ์ 190 × 274 มม. หักหัวกระดาษที่พิมพ์ซ้ำทุกหน้า) · เป้าหมายไม่เกิน 2 หน้า
function estimatePages(){
  const d=$('#doc'), t=d.querySelector('table.pg'); if(!t) return;
  const prev=d.style.display; d.style.display='block'; t.style.width='190mm';
  const probe=document.createElement('div'); probe.style.cssText='position:absolute;visibility:hidden;height:100mm;width:1px';
  document.body.appendChild(probe); const mm=probe.offsetHeight/100; probe.remove();
  const headH=t.tHead.offsetHeight, bodyH=t.tBodies[0].offsetHeight, per=274*mm-headH;
  const mp=t.querySelector('.d-mockpage'), top=t.tBodies[0].getBoundingClientRect().top;
  const split=mp?mp.getBoundingClientRect().top-top:bodyH, sheets=(h,k)=>h>0?Math.ceil(h/per*k):0;
  const pages=Math.max(1,sheets(split-(mp?parseFloat(getComputedStyle(mp).marginTop):0),mp?1:1.03)+sheets(bodyH-split,1));
  t.style.width=''; d.style.display=prev;
  let n=$('#pageNote'); if(!n){ n=document.createElement('div'); n.id='pageNote'; d.parentNode.insertBefore(n,d); }
  n.className='page-note'+(pages>2?' warn':'');
  n.textContent=pages>2?`ประมาณ ${pages} หน้า A4 · เกินเป้า 2 หน้า ลองลดจำนวนภาพ หรือรวมแถวในตาราง`:`ประมาณ ${pages} หน้า A4 · ทุกหน้ามีโลโก้ เลขที่ใบ ลูกค้า และชื่องาน`;
  if(customerCopy()) n.textContent+=' · ฉบับลูกค้า: แสดงเฉพาะเลขที่ใบ ประเภทสินค้า วันที่สั่งงาน ผู้ประสานงาน การจัดส่ง วัสดุ (ไม่มีสี) ไซซ์ จำนวน แพ็คกิ้ง ภาพ และช่องเซ็น (ระบบยังได้รับครบทุกช่อง)';
}
function setPageStyle(){
  const h=state.h, q=t=>String(t||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]+/g,' ');
  const left=`${COMPANY.name} · ใบยืนยันการผลิต ${h.doc_no||''}${num(h.rev)>0?' แก้ไขครั้งที่ '+h.rev:''} · ${h.customer||''}`;
  const box='font-family:"Noto Sans Thai","Sarabun",sans-serif;font-size:8.5pt;color:#555;';
  let st=document.getElementById('pageStyle');
  if(!st){ st=document.createElement('style'); st.id='pageStyle'; document.head.appendChild(st); }
  st.textContent=`@page{size:A4;margin:10mm 10mm 13mm;`+
    `@bottom-left{content:"${q(left)}";${box}}`+
    `@bottom-right{content:"หน้า " counter(page) " / " counter(pages);${box}}}`;
}
function togglePreview(force){
  const on=force??!document.body.classList.contains('preview');
  if(on){ renderDoc(); missing=validate(); showAlert(); updateTotals(); }
  document.body.classList.toggle('preview',on);
  $('#btnPreview').textContent=on?'กลับไปแก้ไข':'ดูตัวอย่าง PDF';
  if(!on) rerender();
  scrollTo(0,0);
}
// Chrome พิมพ์ทันทีไม่รอรูปที่ยังโหลดไม่เสร็จ (เช่น ลิงก์รูปที่เพิ่งขอใหม่) · รอรูปในใบก่อน ไม่เกิน 8 วิ
function docImagesReady(){
  const imgs=[...document.querySelectorAll('#doc img')].filter(i=>!i.complete);
  if(!imgs.length) return Promise.resolve();
  const each=imgs.map(i=>new Promise(r=>{ i.addEventListener('load',r,{once:true}); i.addEventListener('error',r,{once:true}); }));
  return Promise.race([Promise.all(each),new Promise(r=>setTimeout(r,8000))]);
}
// ฟอนต์เว็บโหลดเมื่อมีตัวอักษรใช้จริง · เอกสารซ่อนอยู่จนกดพิมพ์ จึงต้องรอให้โหลดก่อน ไม่งั้น PDF ออกเป็นฟอนต์สำรอง
function docFontsReady(){
  if(!document.fonts) return Promise.resolve();
  const w=['400','500','600','700'].map(x=>document.fonts.load(`${x} 12px "Noto Sans Thai"`,'ใบยืนยัน'));
  return Promise.race([Promise.all(w),new Promise(r=>setTimeout(r,4000))]);
}
docFontsReady();
async function exportPdf(){
  flushSave();
  if(!(await linksReady())) return;
  missing=validate(); showAlert();
  const hard=missing.filter(m=>m.hard).length, soft=missing.length-hard;
  const back=()=>{ if(document.body.classList.contains('preview')) togglePreview(false); else rerender(); scrollTo(0,0); };
  if(hard){ back(); return; }
  if(soft&&!confirm(`ยังไม่ได้กรอก ${soft} ช่อง (ไม่บังคับ)\nช่องที่ว่างจะไม่พิมพ์ลง PDF\n\nกด "ตกลง" = ส่งออก PDF เลย · "ยกเลิก" = กลับไปดูช่องที่ว่าง`)){ back(); return; }
  renderDoc();
  await docFontsReady();
  await docImagesReady();
  const old=document.title;
  document.title=fileBase();
  window.print();
  document.title=old;
}

# กันโปรเจกต์ Supabase แผนฟรีถูกพัก (พักอัตโนมัติเมื่อไม่มีการใช้งาน 7 วัน เช่น ช่วงวันหยุดยาว)
# ต้องตั้ง Secrets: SUPABASE_URL, SUPABASE_ANON_KEY (ดู SETUP.md)
name: keep-alive
on:
  schedule:
    - cron: '0 2 * * *'   # ทุกวัน 09:00 เวลาไทย
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/product_types?select=code&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          # ใช้ header apikey อย่างเดียว: รองรับทั้ง publishable key (sb_publishable_…) และ anon key แบบ JWT
          echo "HTTP $code"
          test "$code" = "200"
